<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med-LMS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med-LMS">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;background:#f4f6fb;color:#1f2937;padding:32px 20px;}
  img.logo{width:132px;height:132px;border-radius:28px;box-shadow:0 8px 24px rgba(31,41,55,.14);background:#fff}
  h1{font-size:20px;margin:22px 0 6px;font-weight:700}
  p{margin:0;color:#6b7280;font-size:14px;line-height:1.7;text-align:center;max-width:320px}
  .spin{width:22px;height:22px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;
        animation:s .8s linear infinite;margin:26px 0 0}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn{display:none;margin-top:24px;padding:13px 28px;background:#2563eb;color:#fff;border-radius:10px;
        text-decoration:none;font-weight:700;font-size:15px}
  a.btn.show{display:inline-block}
  .hint{margin-top:20px;font-size:12.5px;color:#9ca3af}
</style>
</head>
<body>
  <img class="logo" src="icon-512.png" alt="Med-LMS">
  <h1>Med-LMS</h1>
  <p>ระบบสะสมการเรียนรู้พนักงาน<br>กำลังเปิดระบบ กรุณารอสักครู่…</p>
  <div class="spin" id="sp"></div>
  <a class="btn" id="go" href="#">เปิดระบบ Med-LMS</a>
  <div class="hint" id="hint"></div>

<script>
/* ================================================================
   วางลิงก์ Web App ของคุณตรงนี้ (ตัวที่ลงท้ายด้วย /exec)
   ================================================================ */
https://script.google.com/macros/s/AKfycbzwfJ_oxmVge5tdkR-GZhtma6-Ny_zGLk_j1rVY8p1PzqHQV5Gytwr0tu_wnzClpYwsAQ/exec';

// จดทะเบียน service worker — เงื่อนไขที่ทำให้ Chrome ยอมให้ "ติดตั้ง" เป็นแอปจริง
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

var ready = APP_URL.indexOf('XXXXXXX') === -1;
document.getElementById('go').href = APP_URL;

if (!ready) {
  document.getElementById('sp').style.display = 'none';
  document.getElementById('hint').textContent = 'ยังไม่ได้ตั้งค่าลิงก์ — แก้ค่า APP_URL ในไฟล์ index.html';
} else {
  setTimeout(function(){ window.location.replace(APP_URL); }, 900);
  setTimeout(function(){
    document.getElementById('sp').style.display = 'none';
    document.getElementById('go').className = 'btn show';
    document.getElementById('hint').textContent = 'ถ้าไม่เปลี่ยนหน้าอัตโนมัติ ให้กดปุ่มด้านบน';
  }, 4000);
}
</script>
</body>
</html>
