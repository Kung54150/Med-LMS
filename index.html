<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med-LMS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med-LMS">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;background:#f4f6fb;color:#1f2937;padding:32px 20px;}
  img.logo{width:132px;height:132px;border-radius:28px;box-shadow:0 8px 24px rgba(31,41,55,.14);background:#fff}
  h1{font-size:20px;margin:22px 0 6px;font-weight:700}
  p{margin:0;color:#6b7280;font-size:14px;line-height:1.7;text-align:center;max-width:340px}
  .spin{width:22px;height:22px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;
        animation:s .8s linear infinite;margin:26px 0 0}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn,button.btn{display:inline-block;margin-top:22px;padding:13px 28px;background:#2563eb;color:#fff;border:none;
        border-radius:10px;text-decoration:none;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
  button.btn.ghost{background:#fff;color:#4b5563;border:1px solid #d1d5db;margin-top:10px}
  .hint{margin-top:20px;font-size:12.5px;color:#9ca3af;text-align:center;max-width:320px;line-height:1.7}
  .hide{display:none!important}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:26px 24px;max-width:380px;width:100%;
        text-align:center;box-shadow:0 4px 18px rgba(31,41,55,.07);margin-top:24px}
  .card .bell{font-size:40px;line-height:1}
  .card h2{font-size:17px;margin:12px 0 8px;font-weight:700}
  .card p{max-width:none}
  .status{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700}
  .status.on{background:#dcfce7;color:#166534}
  .status.off{background:#fee2e2;color:#991b1b}
  .status.ask{background:#fef3c7;color:#92400e}
  .gear{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:13px;color:#9ca3af;
        background:none;border:none;font-family:inherit;cursor:pointer;padding:8px 14px}
  .gear:hover{color:#2563eb}
</style>
</head>
<body>

  <img class="logo" src="icon-512.png" alt="Med-LMS">
  <h1>Med-LMS</h1>

  <!-- ---------- หน้าจอปกติ: กำลังเข้าระบบ ---------- -->
  <div id="viewLoad">
    <p>ระบบสะสมการเรียนรู้พนักงาน<br>กำลังเปิดระบบ กรุณารอสักครู่…</p>
    <div style="display:flex;justify-content:center"><div class="spin" id="sp"></div></div>
    <div style="text-align:center"><a class="btn hide" id="go" href="#">เปิดระบบ Med-LMS</a></div>
    <div class="hint" id="hint"></div>
  </div>

  <!-- ---------- หน้าจอชวนเปิดการแจ้งเตือน (แสดงครั้งแรกครั้งเดียว) ---------- -->
  <div id="viewAsk" class="card hide">
    <div class="bell">🔔</div>
    <h2>เปิดการแจ้งเตือนบทเรียนใหม่</h2>
    <p>เมื่อมีบทเรียนใหม่เผยแพร่ ระบบจะเด้งแจ้งเตือน<br>และขึ้นตัวเลขสีแดงบนไอคอน Med-LMS ให้ทันที</p>
    <button class="btn" id="btnAllow">เปิดการแจ้งเตือน</button>
    <button class="btn ghost" id="btnSkip">ข้ามไปก่อน</button>
  </div>

  <!-- ---------- หน้าจอตั้งค่าการแจ้งเตือน (กดจากปุ่มเฟือง) ---------- -->
  <div id="viewSet" class="card hide">
    <div class="bell">⚙️</div>
    <h2>ตั้งค่าการแจ้งเตือน</h2>
    <div id="setStatus" class="status ask">กำลังตรวจสอบ…</div>
    <p id="setHint" style="margin-top:14px"></p>
    <button class="btn hide" id="btnAllow2">เปิดการแจ้งเตือน</button>
    <button class="btn ghost" id="btnBack">เข้าสู่ระบบ Med-LMS</button>
  </div>

  <!-- ---------- หน้าตรวจสอบระบบ (เปิดด้วย ?debug=1) ---------- -->
  <div id="viewDbg" class="card hide" style="max-width:520px;text-align:left">
    <h2 style="text-align:center">🔧 ตรวจสอบระบบแจ้งเตือน</h2>
    <pre id="dbgOut" style="font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;
         background:#f4f6fb;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:12px 0 0">กำลังตรวจ…</pre>
    <div style="text-align:center"><button class="btn ghost" id="btnBack2">เข้าสู่ระบบ Med-LMS</button></div>
  </div>

  <button class="gear hide" id="gear">⚙︎ ตั้งค่าการแจ้งเตือน</button>


<!-- ============================================================
     OneSignal SDK — ตัวรับ-ส่งการแจ้งเตือน
     ============================================================ -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
/* ================================================================
   ⚙️ ค่าที่ต้องตั้ง — แก้แค่ 2 บรรทัดนี้
   ================================================================ */

/* 1) ลิงก์ Web App ของ Google Apps Script (ของเดิม ไม่ต้องแก้) */
var APP_URL = 'https://script.google.com/macros/s/AKfycbzwfJ_oxmVge5tdkR-GZhtma6-Ny_zGLk_j1rVY8p1PzqHQV5Gytwr0tu_wnzClpYwsAQ/exec';

/* 2) OneSignal App ID — คัดลอกมาจากหน้า Settings > Keys & IDs ของ OneSignal
      ตราบใดที่ยังไม่ได้ใส่ ระบบจะทำงานปกติทุกอย่าง เพียงแต่ยังไม่มีการแจ้งเตือน */
var ONESIGNAL_APP_ID = '2bb1f89d-af31-4015-88f3-91d5a00ec693';

/* ================================================================
   ตั้งแต่บรรทัดนี้ลงไปไม่ต้องแก้
   ================================================================ */

/* รหัสสำหรับ Safari บนเครื่อง Mac — OneSignal สร้างให้อัตโนมัติ
   ส่วน iPhone ไม่ได้ใช้ค่านี้ แต่ใส่ไว้ก็ไม่มีผลเสีย */
var SAFARI_WEB_ID = 'web.onesignal.auto.1a6e6435-147d-4598-9ef8-2c64afd14980';

var BADGE_CACHE = 'medlms-badge';
var BADGE_KEY   = 'unread-count';
var SW_PATH     = 'Med-LMS/OneSignalSDKWorker.js';   /* นับจาก kung54150.github.io */
var SW_SCOPE    = '/Med-LMS/';

var $  = function (id) { return document.getElementById(id); };
var redirectTimer = null;
var oneSignalStarted = false;

var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;
var isIOS        = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

/* ตรวจว่ากำลังเปิดอยู่ในเบราว์เซอร์ที่ฝังมากับแอปแชท (LINE, Facebook, IG ฯลฯ)
   เบราว์เซอร์พวกนี้รับการแจ้งเตือนไม่ได้ ต้องบอกให้ผู้ใช้เปิดด้วยเบราว์เซอร์จริงก่อน
   ไม่งั้นจะกดปุ่มแล้วค้างโดยไม่รู้สาเหตุ */
var isInAppBrowser = /\bLine\//i.test(navigator.userAgent) ||
                     /FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|TikTok/i.test(navigator.userAgent);
var hasOneSignal = ONESIGNAL_APP_ID.indexOf('PASTE-') === -1;
var appReady     = APP_URL.indexOf('XXXXXXX') === -1;


/* ---------- ล้างตัวเลขบนไอคอนทุกครั้งที่เปิดแอป ---------- */
function clearBadge() {
  try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {}

  if (window.caches) {
    caches.open(BADGE_CACHE)
      .then(function (c) { return c.put(BADGE_KEY, new Response('0')); })
      .catch(function () {});
  }

  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    try {
      navigator.serviceWorker.controller.postMessage({ type: 'MEDLMS_CLEAR_BADGE' });
    } catch (e) {}
  }
}


/* ---------- ลบ Service Worker ตัวเก่า (sw.js) ที่เคยลงไว้ ----------
   เพราะ Service Worker หนึ่งขอบเขตมีได้ตัวเดียว ถ้าไม่ลบตัวเก่าออก
   ตัวใหม่ที่รับ push อาจถูกแทนที่ไปมาจนแจ้งเตือนไม่เข้า */
function removeOldWorker() {
  if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistrations) return;
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    regs.forEach(function (r) {
      var url = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || '';
      if (url.indexOf('/sw.js') !== -1) { r.unregister(); }
    });
  }).catch(function () {});
}


/* ---------- เริ่มการทำงานของ OneSignal ---------- */
function startOneSignal() {
  if (!hasOneSignal || oneSignalStarted) return Promise.resolve();
  oneSignalStarted = true;

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  return new Promise(function (resolve) {
    window.OneSignalDeferred.push(function (OneSignal) {
      OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        safari_web_id: SAFARI_WEB_ID,
        serviceWorkerPath:  SW_PATH,
        serviceWorkerParam: { scope: SW_SCOPE },
        autoResubscribe: true
      }).then(resolve).catch(function (err) {
        /* เก็บข้อความผิดพลาดไว้ให้หน้าตรวจสอบระบบอ่าน */
        window.__osError = (err && err.message) ? err.message : String(err);
        resolve();
      });
    });
    /* กันค้าง: ถ้า SDK โหลดไม่ขึ้นภายใน 4 วินาที ให้ไปต่อ ไม่ขวางการเข้าระบบ */
    setTimeout(resolve, 4000);
  });
}


/* ---------- ขอสิทธิ์แจ้งเตือน (ต้องเรียกจากการกดปุ่มเท่านั้น) ---------- */
function askPermission() {
  return startOneSignal().then(function () {
    return new Promise(function (resolve) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function (OneSignal) {
        OneSignal.Notifications.requestPermission().then(resolve).catch(resolve);
      });
      setTimeout(resolve, 8000);
    });
  });
}


/* ---------- รอจนกว่า OneSignal จะลงทะเบียนเครื่องนี้เสร็จจริง ----------
   สำคัญมาก: หลังผู้ใช้กดอนุญาต OneSignal ยังต้องคุยกับเซิร์ฟเวอร์อีกครู่หนึ่ง
   ถ้าเปลี่ยนหน้าไปก่อน การลงทะเบียนจะถูกตัดกลางคัน และเครื่องจะไม่ได้รับแจ้งเตือนเลย
   คืนค่า true ถ้าลงทะเบียนสำเร็จ, false ถ้ารอเกิน 15 วินาทีแล้วยังไม่สำเร็จ */
function waitForSubscription() {
  return new Promise(function (resolve) {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      try {
        if (window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription &&
            OneSignal.User.PushSubscription.id) {
          clearInterval(timer);
          resolve(true);
          return;
        }
      } catch (e) { /* SDK ยังไม่พร้อม รอรอบหน้า */ }
      if (tries >= 30) { clearInterval(timer); resolve(false); }
    }, 500);
  });
}


/* ---------- เข้าสู่ระบบ Apps Script ---------- */
function go() {
  window.location.replace(APP_URL);
}

function startRedirect() {
  $('go').href = APP_URL;
  redirectTimer = setTimeout(go, 1800);
  setTimeout(function () {
    if (!redirectTimer) return;
    $('sp').style.display = 'none';
    $('go').className = 'btn';
    $('hint').textContent = 'ถ้าไม่เปลี่ยนหน้าอัตโนมัติ ให้กดปุ่มด้านบน';
  }, 4200);
}

function cancelRedirect() {
  if (redirectTimer) { clearTimeout(redirectTimer); redirectTimer = null; }
}

function show(which) {
  ['viewLoad', 'viewAsk', 'viewSet', 'viewDbg'].forEach(function (v) {
    $(v).className = (v === which) ? (v === 'viewLoad' ? '' : 'card') : 'hide';
  });
  if (which === 'viewDbg') $('viewDbg').style.maxWidth = '520px';
}


/* ---------- หน้าตรวจสอบระบบ ----------
   ใช้หาสาเหตุเวลาแจ้งเตือนไม่เข้า เปิดด้วยการต่อท้าย URL ว่า ?debug=1 */
function openDebug() {
  cancelRedirect();
  show('viewDbg');
  $('gear').className = 'gear hide';
  startOneSignal();

  function line(label, value) { return label + ': ' + value + '\n'; }

  function render() {
    var out = '';
    out += line('เปิดแบบติดตั้งแล้ว', isStandalone ? 'ใช่' : 'ไม่ใช่ (ต้องเปิดจากไอคอน)');
    out += line('เบราว์เซอร์ในแอปแชท', isInAppBrowser ? 'ใช่ (ใช้ไม่ได้)' : 'ไม่ใช่');
    out += line('สิทธิ์แจ้งเตือน', ('Notification' in window) ? Notification.permission : 'ไม่รองรับ');
    out += line('SDK โหลดแล้ว', (typeof window.OneSignal !== 'undefined') ? 'ใช่' : 'ยัง');

    var subId = '-', optedIn = '-';
    try {
      if (window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription) {
        subId   = OneSignal.User.PushSubscription.id || 'ยังไม่มี';
        optedIn = String(OneSignal.User.PushSubscription.optedIn);
      }
    } catch (e) { subId = 'อ่านไม่ได้'; }
    out += line('รหัสผู้รับ (สำคัญที่สุด)', subId);
    out += line('สมัครรับแล้ว', optedIn);
    out += line('ข้อผิดพลาด SDK', window.__osError || 'ไม่มี');

    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var sw = '';
        if (!regs.length) sw = '  ไม่มีเลย\n';
        regs.forEach(function (r) {
          var u = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) ||
                  (r.waiting && r.waiting.scriptURL) || '?';
          sw += '  - ' + u.replace(location.origin, '') + '  [scope ' +
                r.scope.replace(location.origin, '') + ']\n';
        });
        $('dbgOut').textContent = out + 'Service Worker:\n' + sw;
      });
    } else {
      $('dbgOut').textContent = out + 'Service Worker: เบราว์เซอร์ไม่รองรับ';
    }
  }

  render();
  setInterval(render, 1500);
}


/* ---------- หน้าจอตั้งค่า ---------- */
function openSettings() {
  cancelRedirect();
  show('viewSet');
  $('gear').className = 'gear hide';

  var perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  var badge = $('setStatus'), hint = $('setHint'), btn = $('btnAllow2');

  /* คืนสภาพปุ่มทุกครั้งที่เปิดหน้านี้ ไม่งั้นถ้าขอสิทธิ์ไม่สำเร็จ
     ปุ่มจะค้างอยู่ที่ข้อความ "กำลังเปิด…" และกดซ้ำไม่ได้ */
  btn.disabled = false;
  btn.textContent = 'เปิดการแจ้งเตือน';

  if (isInAppBrowser && !isStandalone) {
    badge.className = 'status off';
    badge.textContent = 'ต้องเปิดด้วยเบราว์เซอร์ก่อน';
    hint.innerHTML = 'ตอนนี้กำลังเปิดอยู่ในแอปแชท (เช่น LINE) ซึ่งรับการแจ้งเตือนไม่ได้<br><br>' +
                     'กดปุ่ม <b>⋮</b> หรือ <b>•••</b> ที่มุมจอ แล้วเลือก <b>เปิดในเบราว์เซอร์</b><br>' +
                     'จากนั้นค่อยเพิ่มลงหน้าจอโฮมและเปิดการแจ้งเตือน';
    btn.className = 'btn hide';
  } else if (!hasOneSignal) {
    badge.className = 'status ask';
    badge.textContent = 'ยังไม่ได้ตั้งค่าระบบแจ้งเตือน';
    hint.textContent = 'ผู้ดูแลระบบยังไม่ได้ใส่ OneSignal App ID ในไฟล์ index.html';
    btn.className = 'btn hide';
  } else if (isIOS && !isStandalone) {
    badge.className = 'status ask';
    badge.textContent = 'ต้องเพิ่มลงหน้าจอโฮมก่อน';
    hint.innerHTML = 'บน iPhone/iPad ต้องเปิดจากไอคอนบนหน้าจอโฮมเท่านั้น จึงจะรับการแจ้งเตือนได้<br>' +
                     'กดปุ่มแชร์ <b>&#x2934;</b> ใน Safari แล้วเลือก <b>Add to Home Screen</b>';
    btn.className = 'btn hide';
  } else if (perm === 'granted') {
    /* อนุญาตแล้วยังไม่พอ ต้องเช็คด้วยว่าลงทะเบียนกับเซิร์ฟเวอร์สำเร็จหรือไม่
       เพราะถ้าลงทะเบียนไม่ผ่าน เครื่องนี้จะไม่ได้รับแจ้งเตือนแม้จะกดอนุญาตแล้วก็ตาม */
    badge.className = 'status ask';
    badge.textContent = 'กำลังตรวจสอบการลงทะเบียน…';
    hint.textContent = 'กรุณารอสักครู่ อย่าเพิ่งปิดหน้านี้';
    btn.className = 'btn hide';

    startOneSignal().then(waitForSubscription).then(function (ok) {
      if (ok) {
        badge.className = 'status on';
        badge.textContent = '✔ พร้อมรับการแจ้งเตือนแล้ว';
        hint.textContent = 'เมื่อมีบทเรียนใหม่ จะมีตัวเลขขึ้นบนไอคอน Med-LMS';
        btn.className = 'btn hide';
      } else {
        badge.className = 'status off';
        badge.textContent = 'อนุญาตแล้ว แต่ลงทะเบียนไม่สำเร็จ';
        hint.innerHTML = 'ลองกดปุ่มด้านล่างอีกครั้ง<br>' +
                         'ถ้ายังไม่ได้ ให้ปิดแอปแล้วเปิดใหม่ หรือลบไอคอนแล้วติดตั้งใหม่';
        btn.className = 'btn';
        btn.textContent = 'ลองลงทะเบียนอีกครั้ง';
      }
    });
  } else if (perm === 'denied') {
    badge.className = 'status off';
    badge.textContent = '✘ ถูกปิดการแจ้งเตือนไว้';
    hint.textContent = 'กรุณาเปิดสิทธิ์แจ้งเตือนให้ Med-LMS ในหน้าตั้งค่าของเครื่อง แล้วกลับมาเปิดแอปใหม่';
    btn.className = 'btn hide';
  } else {
    badge.className = 'status ask';
    badge.textContent = 'ยังไม่ได้เปิดการแจ้งเตือน';
    hint.textContent = 'กดปุ่มด้านล่างเพื่อรับแจ้งเตือนเมื่อมีบทเรียนใหม่';
    btn.className = 'btn';
  }
}


/* ---------- จุดเริ่มต้น ---------- */
(function init() {
  clearBadge();

  /* ถ้าตั้งค่า OneSignal แล้ว ให้ใช้ Service Worker ตัวใหม่แทน sw.js เดิม
     โดยลงทะเบียนเองเลยไม่รอ OneSignal เพื่อให้ตัวเลขบนไอคอนพร้อมทำงาน
     และเพื่อให้ Android ยังขึ้นปุ่ม "เพิ่มลงหน้าจอโฮม" ได้เหมือนเดิม
     ถ้ายังไม่ได้ตั้งค่า OneSignal ระบบจะคงพฤติกรรมเดิมไว้ทุกอย่าง */
  if ('serviceWorker' in navigator) {
    if (hasOneSignal) {
      removeOldWorker();
      navigator.serviceWorker
        .register('OneSignalSDKWorker.js', { scope: './' })
        .catch(function () {});
    } else {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  if (!appReady) {
    $('sp').style.display = 'none';
    $('hint').textContent = 'ยังไม่ได้ตั้งค่าลิงก์ — แก้ค่า APP_URL ในไฟล์ index.html';
    return;
  }

  $('gear').className = 'gear';
  $('gear').onclick   = openSettings;
  $('btnBack').onclick = go;

  $('btnAllow').onclick = function () {
    var b = this;
    b.disabled = true;
    b.textContent = 'กำลังเปิด…';
    try { localStorage.setItem('ml_asked', '1'); } catch (e) {}
    askPermission()
      .then(function () { b.textContent = 'กำลังลงทะเบียน…'; return waitForSubscription(); })
      .then(go);
  };

  $('btnSkip').onclick = function () {
    try { localStorage.setItem('ml_asked', '1'); } catch (e) {}
    go();
  };

  $('btnAllow2').onclick = function () {
    this.disabled = true;
    this.textContent = 'กำลังเปิด…';
    askPermission().then(openSettings);   /* openSettings จะรอผลลงทะเบียนและรายงานให้เอง */
  };

  $('btnBack2').onclick = go;

  /* เปิดหน้าตรวจสอบระบบด้วยลิงก์ ...?debug=1 */
  if (location.search.indexOf('debug=1') !== -1) { openDebug(); return; }

  /* เปิดหน้าตั้งค่าโดยตรงด้วยลิงก์ ...?settings=1 */
  if (location.search.indexOf('settings=1') !== -1) { openSettings(); return; }

  var asked = false;
  try { asked = localStorage.getItem('ml_asked') === '1'; } catch (e) {}

  var shouldAsk = hasOneSignal && !asked && isStandalone &&
                  ('Notification' in window) && Notification.permission === 'default';

  if (shouldAsk) {
    show('viewAsk');
    startOneSignal();          /* เตรียม SDK ไว้ล่วงหน้า จะได้กดปุ่มแล้วติดทันที */
    return;
  }

  startOneSignal();
  startRedirect();
})();
</script>
</body>
</html>
