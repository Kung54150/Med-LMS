/* ================= แบบทดสอบ (บันทึก ทำต่อได้ เซ็นชื่อเมื่อผ่าน) ================= */
function testShell(pg) {
  const full = pg.type === 'practice';
  return `<div class="content-card"><div class="drill-head"><h3>🏁 ${pg.title}</h3></div>
      <p>${full ? `รวม <strong>${pg.n} กราฟ</strong> แต่ละกราฟอ่าน ${STEPS(pg)} ขั้น: <strong>${pg.gen === 'tqu' ? 'จังหวะ+HR → T wave → QT → U wave → สรุป' : pg.gen === 'all' ? 'จังหวะ+HR → P → PR → QRS → T → QT → U → สรุปและสิ่งที่ต้องทำ' : 'จังหวะ+HR → P wave → QRS → PR → สรุป'}</strong> · ${pg.exam ? `กราฟที่ถูกครบทั้ง ${STEPS(pg)} ขั้นจึงนับว่าอ่านถูก` : `กราฟนับว่าอ่านถูกเมื่อ <strong>ข้อสรุปถูก</strong> และผิดได้ไม่เกิน <strong>${wrongAllowed(pg)} ขั้น</strong>`}` : `${pg.hint} · รวม ${pg.n} ข้อ (ข้อละ 1 กราฟ)`}
      · ผ่านเมื่อได้ <strong>${Math.ceil(pg.n * PASS)}/${pg.n} ${unitName(pg)} (${Math.round(PASS * 100)}%)</strong> · ทำค้างไว้ได้ ระบบบันทึกทุกข้อ</p>
      <div class="t-prog"><span id="tProgTxt"></span><span class="qdots" id="tDots"></span></div></div>
    <div id="monSlot"></div>
    <div id="tQ"><div class="quiz-box"><div class="pq-head"><span id="pLabel"></span></div>
      <div class="q-text" id="qText"></div><div id="opts"></div></div>
      <div id="fb"></div>
      <div class="nav-row"><button class="ghost-btn" onclick="prevPage()">← ย้อน</button><button class="next-btn" id="qNext" hidden>ข้อต่อไป →</button></div></div>
    <div id="tFinal"></div>
    ${full ? `<div class="sheet" id="sheetBox"><div class="sheet-h">📋 ผลอ่าน EKG ของฉัน <span id="sheetNo"></span></div>
      <table class="sheet-t"><tbody id="pSheet"></tbody></table></div>` : ''}`;
}
let D = null, P = null, results = [], picked = [], qi = 0;
function renderProg() {
  const t = T(), pg = curPg(), n = pg.n, u = unitName(pg), ur = unitResults(t, pg), cur = unitsDone(t, pg);
  el('tProgTxt').textContent = `ทำแล้ว ${Math.min(cur, n)}/${n} ${u} · อ่านถูก ${unitsRight(t, pg)} ${u}${t.attempt > 1 ? ` · ครั้งที่ ${t.attempt}` : ''}`;
  el('tDots').innerHTML = Array.from({ length: n }, (_, i) => `<b class="${ur[i] === true ? 'ok' : ur[i] === false ? 'no' : i === cur ? 'cur' : ''}"></b>`).join('');
}
function startItem() {
  const pg = curPg(), t = T();
  if (t.i === 0) paperBuf = { items: [], images: [] };
  el('qNext').onclick = startItem;
  renderProg();
  if (t.i >= totalItems(pg)) return showFinal();
  el('tQ').hidden = false; el('tFinal').innerHTML = '';
  if (el('sheetBox')) el('sheetBox').hidden = false;
  if (pg.type === 'drill') {
    seedRNG(t.base + t.i * 7919);
    D = EX[pg.ex]();
    useStrip(D.S, `ข้อสอบข้อ ${t.i + 1}/${pg.n}`); setOverlay(D.draw);
    el('pLabel').textContent = `ข้อ ${t.i + 1}/${pg.n}`;
    el('qText').textContent = D.q;
    el('opts').innerHTML = D.opts.map(([x], k) => `<button class="q-btn" data-i="${k}">${x}</button>`).join('');
    el('opts').onclick = answerDrill;
  } else {
    const m = STEPS(pg), k = Math.floor(t.i / m), j = t.i % m;
    if (j === 0) t.cur = [];
    seedRNG(t.base + k * 7919);
    const Sx = pg.exam ? genExamStrip() : pg.gen === 'tqu' ? genTquStrip() : pg.gen === 'all' ? genAllStrip() : genStrip(pg.kinds);
    S = Sx;
    P = pg.exam ? buildExamQs(Sx) : pg.gen === 'tqu' ? buildTquQs(Sx) : pg.gen === 'all' ? buildAllQs(Sx) : buildQs(Sx, pg.kinds);
    useStrip(Sx, `กราฟที่ ${k + 1}/${pg.n}`);
    results = t.res.slice(k * m, k * m + j);
    picked = t.cur.map((ix, m) => P[m].opts[ix][0]);
    qi = j;
    el('sheetNo').textContent = `· กราฟที่ ${k + 1}/${pg.n}`;
    setOverlay(j ? P[j - 1].ov : 'none');
    renderPQ();
    el('opts').onclick = answerPractice;
  }
  el('fb').innerHTML = ''; el('qNext').hidden = true;
}
function afterAnswer(ok, exText) {
  const t = T(), pg = curPg();
  t.res.push(ok); t.i++; if (ok) t.right++;
  persist(); renderProg();
  el('fb').innerHTML = `<div class="q-fb ${ok ? 'ok' : 'bad'}"><strong>${ok ? '✓ ถูกต้อง' : '✕ ยังไม่ถูก — ดูเส้นวัดบนกราฟ'}</strong>${exText}</div>`;
  const endStrip = pg.type === 'practice' && t.i % STEPS(pg) === 0;
  el('qNext').textContent = t.i >= totalItems(pg) ? 'ดูผลสอบ →' : endStrip ? 'กราฟถัดไป →' : 'ขั้นต่อไป →';
  el('qNext').hidden = false;
}
function answerDrill(e) {
  const b = e.target.closest('.q-btn'); if (!b || b.disabled || !D) return;
  const ci = +b.dataset.i, ok = D.opts[ci][1];
  [...el('opts').children].forEach((x, k) => { x.disabled = true; if (D.opts[k][1]) x.classList.add('ok'); });
  if (!ok) b.classList.add('bad');
  const g = D; setOverlay(p => (typeof g.reveal === 'function' ? g.reveal : OV[g.reveal])(p));
  pushPaperItem({ q: D.q, chosenText: D.opts[ci][0], correctText: (D.opts.find(o => o[1]) || [''])[0], correct: ok });
  afterAnswer(ok, D.ex);
}
function renderPQ() {
  const Q = P[qi];
  el('pLabel').textContent = `กราฟที่ ${Math.floor(T().i / STEPS(curPg())) + 1}/${curPg().n} · ขั้นที่ ${qi + 1}/${STEPS(curPg())} · ${Q.tag}`;
  el('qText').textContent = Q.q;
  el('opts').innerHTML = Q.opts.map(([x], k) => `<button class="q-btn" data-i="${k}">${x}</button>`).join('');
  renderSheet();
}
function renderSheet() {
  el('pSheet').innerHTML = P.map((Q, i) => {
    const done = results[i] !== undefined, right = Q.opts.find(o => o[1])[0];
    const val = done
      ? `<span class="${results[i] ? 'sv-ok' : 'sv-no'}">${results[i] ? '✓' : '✕'} ${picked[i]}</span>${results[i] ? '' : `<div class="sv-fix">ที่ถูก: ${right}</div>`}`
      : `<span class="sv-wait">${i === qi ? '← กำลังตอบ' : '…'}</span>`;
    return `<tr class="${i === qi && !done ? 'cur' : ''}"><th>${i + 1}. ${Q.tag}</th><td>${val}</td></tr>`;
  }).join('');
}
function answerPractice(e) {
  const b = e.target.closest('.q-btn'); if (!b || b.disabled) return;
  const k = +b.dataset.i, Q = P[qi], ok = Q.opts[k][1], t = T();
  [...el('opts').children].forEach((x, j) => { x.disabled = true; if (Q.opts[j][1]) x.classList.add('ok'); });
  if (!ok) b.classList.add('bad');
  results[qi] = ok; picked[qi] = Q.opts[k][0]; t.cur.push(k);
  setOverlay(Q.ov);
  let ex = Q.ex;
  if (qi === P.length - 1) {
    ex += `<div style="margin-top:4px">คำตอบของกราฟนี้: <b>${curPg().exam ? examSummary(S) : curPg().gen === 'tqu' ? TQU[S.kind] : curPg().gen === 'all' ? allSummary(S) : DX[S.kind]}</b></div>`;
    // กระดาษคำตอบ: 1 กราฟ = 1 ข้อ รวมทุกขั้นย่อยเป็นข้อความสรุปเดียว ไม่แยกข้อย่อย
    const pg = curPg(), m = STEPS(pg), gi = Math.floor(T().i / m);
    const wrong = results.filter(x => !x).length;
    pushPaperItem({
      q: `กราฟที่ ${gi + 1}/${pg.n}`,
      // ขั้นที่ตอบผิด แสดงเฉลยที่ถูกต้องต่อท้ายไว้ในบรรทัดเดียวกันเลย (index.html จะเน้นสีแดงให้บรรทัดที่มี ✕)
      chosenText: P.map((Qs, i) => {
        const right = Qs.opts.find(o => o[1])[0];
        return results[i] ? `${Qs.tag}: ${picked[i]} ✓` : `${Qs.tag}: ${picked[i]} ✕ (เฉลย: ${right})`;
      }).join('\n'),
      correctText: P.map((Qs, i) => `${Qs.tag}: ${Qs.opts.find(o => o[1])[0]}`).join('\n'),
      correct: !!results[m - 1] && wrong <= wrongAllowed(pg)
    });
  }
  qi++;
  renderSheet();
  afterAnswer(ok, ex);
}

function showFinal() {
  const pg = curPg(), les = curLes(), t = T();
  const score = unitsRight(t, pg), pct = score / pg.n, pass = pct >= PASS, u = unitName(pg);
  const full = isFull(pg), dScore = full ? t.right : score, dTotal = full ? totalItems(pg) : pg.n, dPct = dTotal ? dScore / dTotal : 0;
  el('tQ').hidden = true;
  if (el('sheetBox')) el('sheetBox').hidden = true;
  // ทุกครั้งที่ "ผ่าน" ให้บันทึกทับด้วยผลรอบล่าสุดเสมอ (ของเดิมเคยเช็คว่าต้อง "ดีกว่ารอบก่อน" เท่านั้นถึงจะบันทึก
  // ซึ่งถ้าเคยผ่านครบ 10/10 กราฟมาแล้วครั้งหนึ่ง รอบต่อไปจะไม่มีทาง "มากกว่า" ได้อีก เลยไม่เคยบันทึกทับให้ ทำให้
  // กระดาษคำตอบค้างเป็นข้อมูลรอบแรกสุดตลอด ต่อให้สอบใหม่ผ่านอีกกี่รอบก็ตาม)
  if (pass) {
    const firstTime = !t.passed;
    t.passed = true; t.best = { score, total: pg.n, right: t.right, allSteps: totalItems(pg), date: new Date().toISOString() };
    if (firstTime) saved.done[les.id] = true;
    persist(); recordPass(les, t);
  }
  const needSign = saved.done[les.id] && !t.signed && SIGN();
  el('tFinal').innerHTML = `<div class="q-fb ${pass ? 'ok' : 'bad'} final-card">
      <strong>${pass ? '🎉 สอบผ่าน' : 'ยังไม่ผ่าน'} · คะแนน ${dScore}/${dTotal} (${Math.round(dPct * 100)}%)</strong>
      ${full ? `<span style="opacity:.75">ผ่านเกณฑ์รายกราฟ ${score}/${pg.n} กราฟ (แต่ละกราฟผิดได้ไม่เกิน ${wrongAllowed(pg)} ขั้น) · </span>` : ''}${pass ? 'เก่งมาก! บทนี้ผ่านเกณฑ์แล้ว' : `ต้องอ่านถูก ${Math.ceil(pg.n * PASS)} ${u}ขึ้นไป ทบทวนเนื้อหาแล้วสอบใหม่ได้ (สุ่มโจทย์ชุดใหม่)`}
    </div>
    ${needSign ? signBox(les, t) : ''}
    ${!needSign && saved.done[les.id] ? (SIGN() ? '<div class="q-fb ok">✍️ เซ็นชื่อยืนยันและบันทึกผลเรียบร้อยแล้ว</div>' : '<div class="q-fb ok">💾 บันทึกความคืบหน้าไว้ในเบราว์เซอร์นี้แล้ว</div>') : ''}
    <div class="nav-row">
      <button class="ghost-btn" onclick="retakeTest()">🔁 ${pass ? 'สอบใหม่เพื่อฝึกเพิ่ม' : 'สอบใหม่'}</button>
      ${saved.done[les.id] && !needSign ? '<button class="next-btn" onclick="nextPage()">จบบทนี้ →</button>' : ''}
      ${!pass && !saved.done[les.id] ? `<button class="next-btn" onclick="startLesson(${ST.lesson}, true)">ทบทวนเนื้อหา</button>` : ''}
    </div>`;
  if (needSign) initSigPad();
  setOverlay('none');
  el('tFinal').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function retakeTest() {
  saved.test[curLes().id] = freshTest(T());
  persist(); startItem();
  el('monitor').scrollIntoView({ block: 'nearest' });
}

/* ---- บันทึกผลสอบผ่านลงระบบ (ขึ้นในประวัติ/หน้าแอดมินทันที แม้ยังไม่เซ็น) ---- */
function recordPass(les, t) {
  const r = gs(); if (!r || !t.best) return;
  whenPaperReady(() => {
    r.withSuccessHandler(res => { if (res && res.attemptId) { t.attemptId = res.attemptId; persist(); } })
     .withFailureHandler(err => toast('บันทึกผลสอบไม่สำเร็จ: ' + (err && err.message || err)))
     // score/total = เกณฑ์ผ่านจริง (รายกราฟ) ใช้ตรวจสอบฝั่งเซิร์ฟเวอร์ / displayScore-Total = คะแนนที่จะโชว์บนกระดาษคำตอบ (รายขั้น .../50)
     .saveEkgResult({
       lessonId: les.id, lessonTitle: les.title,
       score: t.best.score, total: t.best.total,
       displayScore: t.best.right != null ? t.best.right : t.best.score,
       displayTotal: t.best.allSteps != null ? t.best.allSteps : t.best.total,
       passedAt: t.best.date, paper: paperBuf
     });
  });
}

/* ---- ลายเซ็น ---- */
function signBox(les, t) {
  const pg = curPg(), full = isFull(pg);
  const b = t.best || { score: t.right, total: pg.n, right: t.right, allSteps: totalItems(pg) };
  const dScore = full ? (b.right != null ? b.right : t.right) : b.score;
  const dTotal = full ? (b.allSteps != null ? b.allSteps : totalItems(pg)) : b.total;
  return `<div class="sign-box">
    <div class="sign-h">✍️ เซ็นชื่อยืนยันการผ่านบทเรียน</div>
    <div class="sign-sub">${les.title} · คะแนน ${dScore}/${dTotal} ${full ? 'ขั้น' : unitName(pg)} — ลายเซ็นนี้ใช้ในแบบฟอร์ม OJT ของโรงพยาบาล</div>
    <div class="sig-wrap"><canvas id="sigPad" width="500" height="170"></canvas></div>
    <div class="sign-sub">ใช้นิ้วหรือเมาส์เซ็นในกรอบ</div>
    <div class="nav-row"><button class="ghost-btn" onclick="clearSig()">ล้าง</button>
      <button class="ghost-btn" onclick="renderMenu()">เซ็นภายหลัง</button>
      <button class="next-btn" id="sigOk" onclick="submitSig()">ยืนยันลายเซ็น</button></div>
  </div>`;
}
let sigCtx = null, sigDraw = false, sigHas = false;
function initSigPad() {
  const c = el('sigPad'); sigCtx = c.getContext('2d'); sigHas = false;
  sigCtx.fillStyle = '#fff'; sigCtx.fillRect(0, 0, c.width, c.height);
  sigCtx.strokeStyle = '#1f2937'; sigCtx.lineWidth = 2.4; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  const pos = e => { const r = c.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return { x: (p.clientX - r.left) * c.width / r.width, y: (p.clientY - r.top) * c.height / r.height }; };
  const start = e => { e.preventDefault(); sigDraw = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = e => { if (!sigDraw) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHas = true; };
  const end = () => { sigDraw = false; };
  c.addEventListener('mousedown', start); c.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  c.addEventListener('touchstart', start, { passive: false }); c.addEventListener('touchmove', move, { passive: false }); c.addEventListener('touchend', end);
}
function clearSig() { const c = el('sigPad'); sigCtx.fillStyle = '#fff'; sigCtx.fillRect(0, 0, c.width, c.height); sigHas = false; }
function submitSig() {
  if (!sigHas) return toast('กรุณาเซ็นชื่อในกรอบก่อน');
  const les = curLes(), t = T(), b = t.best, sig = el('sigPad').toDataURL('image/png');
  const btn = el('sigOk'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  const ok = () => { t.signed = true; persist(); toast('บันทึกผลและลายเซ็นแล้ว'); showFinal(); };
  const r = gs();
  if (!r) return ok();   // เปิดนอก Apps Script (ทดลอง)
  whenPaperReady(() => {
    r.withSuccessHandler(ok)
     .withFailureHandler(err => { btn.disabled = false; btn.textContent = 'ยืนยันลายเซ็น'; toast('บันทึกไม่สำเร็จ: ' + (err && err.message || err)); })
     .saveEkgResult({
       lessonId: les.id, lessonTitle: les.title,
       score: b.score, total: b.total,
       displayScore: b.right != null ? b.right : b.score,
       displayTotal: b.allSteps != null ? b.allSteps : b.total,
       passedAt: b.date, signature: sig, paper: paperBuf
     });
  });
}

/* ---- ลิงก์ตรงเข้าบท: ?page=ekg&lesson=nsr หรือ #nsr  /  ?page=ekg&print=all (ปุ่ม "🖨️ เนื้อหา EKG" หน้าแอดมิน) ---- */
function openFromLink(id) {
  id = (id || '').replace(/^#/, '').trim();
  const i = LESSONS.findIndex(l => l.id === id);
  if (i >= 0) startLesson(i); else renderMenu();
}
addEventListener('keydown', e => { if (e.key === 'Escape' && el('v-lesson').classList.contains('active')) renderMenu(); });
Object.assign(window, { goBack, renderMenu, startLesson, prevPage, nextPage, answerQuiz, retakeTest, clearSig, submitSig, printLesson, showLessonPicker, pkSetAll, printSelectedLessons });
el('v-menu').innerHTML = '<div class="menu-meta" style="padding:30px 0;text-align:center">กำลังโหลดความคืบหน้า…</div>';
loadCloud(() => {
  try {
    if (gs() && google.script.url) google.script.url.getLocation(loc => {
      const p = loc.parameter || {};
      if (p.print === 'all') showLessonPicker(); else openFromLink(p.lesson || loc.hash);
    });
    else {
      const qs = new URLSearchParams(location.search);
      if (qs.get('print') === 'all') showLessonPicker(); else openFromLink(qs.get('lesson') || location.hash);
    }
  } catch (e) { renderMenu(); }
});
if (document.fonts) document.fonts.ready.then(kick);

})();
</script>
