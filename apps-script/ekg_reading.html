<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การอ่าน EKG — บทเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF3F5; --grid-minor:#F6CDD6; --grid-major:#E49AAB; --trace:#1F1F24;
  --c-p:#2E86C1; --c-qrs:#C0305A; --c-t:#1E8449; --c-m:#0E8A5F;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:#FFF5F5;color:#2D2D2D;font-family:'Sarabun',sans-serif;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding-bottom:40px}
.topbar{background:linear-gradient(135deg,#E8396B,#FF6B8A);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.topbar .back{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:0 6px}
.topbar h1{font-size:1rem;font-weight:700}.topbar .sub{font-size:.72rem;opacity:.9;margin-top:1px}
.view{padding:16px;display:none}.view.active{display:block}
button{font-family:inherit}
button:focus-visible{outline:2px solid #E8396B;outline-offset:2px}

/* MENU */
.menu-meta{font-size:.75rem;color:#8A7A80;margin-bottom:10px}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-card{width:100%;text-align:left;background:#fff;border:1px solid #F0D0D8;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s;box-shadow:0 1px 3px rgba(232,57,107,.08)}
.lesson-card:hover{border-color:#E8396B;box-shadow:0 2px 8px rgba(232,57,107,.15)}
.lesson-card > span:nth-child(2){display:flex;flex-direction:column}
.lnum{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
.lnum.todo{background:#F9DDE4;color:#E8396B}
.lnum.done{background:#27AE60;color:#fff}
.ltitle{font-size:.92rem;font-weight:600;color:#2D2D2D}
.ldesc{font-size:.75rem;color:#8A7A80;margin-top:1px}
.lstatus{margin-left:auto;font-size:.7rem;color:#1E8449;font-weight:600;white-space:nowrap}
.progress-bar{background:#F0D0D8;border-radius:6px;height:6px;margin:4px 0 6px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#E8396B,#FF6B8A);height:100%;border-radius:6px;transition:width .5s}

/* LESSON */
.lesson-header{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid #F0D0D8}
.lesson-header h2{font-size:1.05rem;color:#E8396B}
.lh-sub{font-size:.75rem;color:#8A7A80}
.content-card{background:#fff;border:1px solid #F0D0D8;border-radius:12px;padding:14px;margin-bottom:10px}
.content-card h3{font-size:.95rem;color:#E8396B;margin-bottom:6px}
.content-card p{font-size:.88rem;color:#444;line-height:1.65;margin-bottom:6px}
.highlight{background:#FFF0F3;border-left:3px solid #E8396B;padding:7px 10px;border-radius:0 6px 6px 0;font-size:.86rem;color:#B82556;margin:6px 0;line-height:1.6}
.key-point{background:#F0FAF0;border-left:3px solid #27AE60;padding:7px 10px;border-radius:0 6px 6px 0;font-size:.86rem;color:#1A6A34;margin:6px 0;line-height:1.7}
.tag{display:inline-block;font-size:.65rem;background:#0E8A5F;color:#fff;border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px}
.svg-area{background:#fff;border:1px solid #F0D0D8;border-radius:10px;padding:6px;margin-bottom:10px}
.svg-area svg{width:100%;display:block}
.svg-cap{font-size:.68rem;color:#8A7A80;padding:0 4px 4px}
.anno{font-family:'IBM Plex Mono','Sarabun',monospace}

/* MONITOR (กราฟจริง) */
.monitor{background:#fff;border:1px solid #F0D0D8;border-radius:12px;overflow:hidden;margin-bottom:10px}
.monhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #F0D0D8;font-size:.72rem;color:#8A7A80}
.monhead .legend{display:flex;gap:8px;align-items:center}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:middle}
.stripbox{overflow-x:auto;background:var(--paper)}
.stripbox canvas{display:block}
.scroll-hint{font-size:.68rem;color:#8A7A80;padding:4px 12px}
@media (min-width:660px){.scroll-hint{display:none}}
.small-btn{border:1px solid #F0D0D8;background:#fff;color:#E8396B;border-radius:7px;padding:3px 10px;font-size:.75rem;cursor:pointer}

/* QUIZ */
.quiz-box{background:#FFF8F0;border:1px solid #FFE0C0;border-radius:12px;padding:12px;margin-bottom:10px}
.q-label{font-size:.72rem;color:#E8396B;font-family:'IBM Plex Mono','Sarabun',monospace;margin-bottom:4px}
.q-text{font-size:.95rem;font-weight:600;color:#2D2D2D;margin-bottom:8px}
.q-btn{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #E0D0C0;color:#2D2D2D;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:.88rem;cursor:pointer;line-height:1.4;transition:background .12s,border-color .12s}
.q-btn:hover:not(:disabled){background:#FFF5F0;border-color:#E8396B}
.q-btn:disabled{opacity:.55;cursor:default}
.q-btn.ok{border-color:#27AE60;background:#F0FAF0;color:#1A6A34;opacity:1}
.q-btn.bad{border-color:#E8396B;background:#FFF0F3;color:#B82556;opacity:1}
.q-fb{border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:.86rem;line-height:1.6}
.q-fb.ok{background:#F0FAF0;border:1px solid #BFE5C8;color:#1A6A34}
.q-fb.bad{background:#FFF0F3;border:1px solid #F0C0D0;color:#B82556}
.q-fb strong{display:block;margin-bottom:2px}
.pass-note{margin-top:6px;font-weight:700;color:#1A6A34}
.nav-row{display:flex;gap:8px;margin-top:6px}
.next-btn{flex:1;width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(135deg,#E8396B,#FF6B8A);color:#fff;font-size:.92rem;cursor:pointer;font-weight:600}
.next-btn:hover{opacity:.92}
.pass-btn{margin-top:8px;background:linear-gradient(135deg,#1E8449,#27AE60)}
.ghost-btn{padding:11px 14px;border:1.5px solid #F0D0D8;border-radius:8px;background:#fff;color:#E8396B;font-size:.88rem;cursor:pointer}
.ghost-btn.wide{width:100%;margin-top:8px}
.back-btn{background:none;border:none;color:#E8396B;font-size:.85rem;cursor:pointer;padding:0 0 8px}
.done-card{text-align:center}
.done-card .next-btn{margin-top:8px}
/* เลือกบทที่จะพิมพ์ */
.pk-tools{display:flex;gap:8px;margin-bottom:10px}
.pk-tools button{padding:7px 12px;border:1.5px solid #F0D0D8;border-radius:8px;background:#fff;color:#E8396B;font-size:.8rem;cursor:pointer}
.pk-list{max-height:46vh;overflow-y:auto;border:1px solid #F0D0D8;border-radius:8px;padding:4px 2px;margin-bottom:12px}
.pk-item{display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:.88rem;color:#333;border-bottom:1px solid #F7E3E8;cursor:pointer}
.pk-item:last-child{border-bottom:none}
.pk-item input{width:17px;height:17px;accent-color:#E8396B;flex:none}
.drill-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{display:flex;gap:5px}
.meter i{width:13px;height:13px;border-radius:50%;border:2px solid #27AE60;display:inline-block}
.meter i.on{background:#27AE60}
.qdots{display:flex;gap:5px;margin-bottom:8px}
.qdots b{width:26px;height:6px;border-radius:3px;background:#EEDFD2}
.qdots b.cur{background:#C9A98E}.qdots b.ok{background:#27AE60}.qdots b.no{background:#E8396B}
.step-dots{display:flex;gap:5px;justify-content:center;margin:4px 0 12px;flex-wrap:wrap}
.sdot{width:9px;height:9px;border-radius:50%;background:#F0D0D8}
.sdot.star{border-radius:2px;transform:rotate(45deg)}
.sdot.done{background:#27AE60}.sdot.now{background:#E8396B}
.pq.locked{opacity:.4;pointer-events:none}
.pq .q-label{font-size:.8rem;font-weight:700}
.pq-fb .q-fb{margin:4px 0 0}
.pq-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:#E8396B;font-weight:600;margin:2px 2px 8px}
.pq-head .qdots{margin:0}
.pq-result{font-size:.92rem}
@media (min-height:640px){.monitor.sticky{position:sticky;top:62px;z-index:4;box-shadow:0 6px 14px -8px rgba(0,0,0,.25)}}
.sheet{background:#fff;border:1.5px solid #F0D0D8;border-radius:12px;padding:12px;margin-top:12px}
.sheet-h{font-weight:700;color:#E8396B;font-size:.9rem;margin-bottom:6px}
.sheet-h span{color:#8A7A80;font-weight:400;font-size:.8rem}
.sheet-t{width:100%;border-collapse:collapse;font-size:.84rem}
.sheet-t th{text-align:left;white-space:nowrap;vertical-align:top;padding:7px 10px 7px 4px;color:#555;font-weight:600;width:1%}
.sheet-t td{padding:7px 4px;line-height:1.45}
.sheet-t tr+tr th,.sheet-t tr+tr td{border-top:1px dashed #F0D0D8}
.sheet-t tr.cur{background:#FFF8F0}
.sv-ok{color:#1A6A34}.sv-no{color:#B82556}.sv-wait{color:#B0A0A6}
.sv-fix{font-size:.78rem;color:#1A6A34;margin-top:2px}
.sheet .pq-result{margin:10px 0 0}
.top-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.t-prog{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:#E8396B;font-weight:600;margin-top:6px}
.t-prog .qdots{margin:0;flex-wrap:wrap}
.t-prog .qdots b{width:16px}
.lstatus.s-sign{color:#B45309}
.lstatus.s-doing{color:#2E86C1}
.final-card{font-size:.95rem}
.sign-box{background:#fff;border:1.5px solid #F0D0D8;border-radius:12px;padding:12px;margin-bottom:10px}
.sign-h{font-weight:700;color:#E8396B;font-size:.95rem}
.sign-sub{font-size:.78rem;color:#8A7A80;margin:4px 0 8px}
.sig-wrap{border:1.5px dashed #E0B8C4;border-radius:10px;overflow:hidden;background:#fff;touch-action:none}
.sig-wrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.disclaimer{color:#8A7A80;font-size:.68rem;text-align:center;padding:12px 16px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2D2D2D;color:#fff;padding:8px 16px;border-radius:8px;font-size:.85rem;z-index:9}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.steps8{margin:.3rem 0 .6rem;padding-left:1.4rem;font-size:.86rem;line-height:1.6}.steps8 li{margin:.1rem 0}
.norm-t{width:100%;border-collapse:collapse;font-size:.78rem;margin:.3rem 0}.norm-t th,.norm-t td{border:1px solid #F3C6D3;padding:4px 6px;vertical-align:top;text-align:left}.norm-t th{background:#FFE4EC;color:#B0204E}

/* พิมพ์บทเรียน (เนื้อหา + ข้อสอบเปล่า) */
.pr-loading{position:fixed;inset:0;background:rgba(255,245,245,.96);z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.pr-loading-box{font-size:.95rem;color:#B0204E;font-weight:600;line-height:1.8}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:10px}
  .pr-title{font-size:1.25rem;color:#B0204E;border-bottom:2px solid #E8396B;padding-bottom:6px;margin:20px 0 10px}
  .pr-title:first-child{margin-top:0}
  .pr-block{margin-bottom:16px;page-break-inside:avoid}
  .pr-block h3{color:#E8396B;font-size:1rem;margin-bottom:4px}
  .pr-body p{font-size:.9rem;line-height:1.6;margin-bottom:5px;color:#222}
  .pr-strip{width:100%;max-width:680px;border:1px solid #ccc;display:block;margin:6px 0}
  .pr-svg{max-width:380px;margin:6px 0}
  .pr-svg svg{width:100%;display:block}
  .pr-qtext{font-weight:600;margin:9px 0 4px;font-size:.92rem}
  .pr-choices,.pr-blank-choices{list-style:none;margin:0 0 6px}
  .pr-choices li,.pr-blank-choices li{padding:3px 0;font-size:.88rem}
  .pr-right{color:#1A6A34;font-weight:700}
  .pr-box{display:inline-block;width:12px;height:12px;border:1.5px solid #888;border-radius:3px;margin-right:8px;vertical-align:middle}
  .pr-exam-item{margin-bottom:22px;page-break-inside:avoid}
  .pr-exam-no{font-weight:700;color:#B0204E;margin-bottom:4px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back" id="homeLink" href="#" target="_top" onclick="return goBack(event)" aria-label="กลับ" style="text-decoration:none">‹</a>
    <div><h1>การอ่าน EKG</h1><div class="sub">ภาพประกอบ · กราฟจริง · ฝึกจนคล่อง</div></div>
  </div>
  <div class="view active" id="v-menu"></div>
  <div class="view" id="v-lesson"></div>
  <div class="disclaimer">บทเรียนฝึกทบทวน กราฟเป็นสัญญาณจำลอง — ไม่ใช่หลักสูตรรับรองและไม่ใช้แทนการวินิจฉัย</div>
</div>

<div id="park" hidden>
  <section class="monitor" id="monitor" aria-label="กราฟ EKG">
    <div class="monhead">
      <span>Lead II · 25 mm/s · 10 mm/mV · <span id="stripInfo"></span></span>
      <span class="legend">
        <span><span class="key" style="background:var(--c-p)"></span>P</span>
        <span><span class="key" style="background:var(--c-qrs)"></span>QRS</span>
        <span><span class="key" style="background:var(--c-t)"></span>T</span>
        <button class="small-btn" id="replay">▶ เล่นใหม่</button>
      </span>
    </div>
    <div class="stripbox" id="stripbox"><canvas id="cv"></canvas></div>
    <div class="scroll-hint">↔ เลื่อนกราฟซ้าย-ขวาเพื่อดูทั้งหมด</div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="pr-loading" id="prLoading" hidden><div class="pr-loading-box">🖨️ กำลังเตรียมเอกสารพิมพ์…<br><span id="prLoadingN"></span></div></div>
<div id="printArea"></div>

<script>
(() => {
/* ================================================
   SVG ภาพประกอบ (แบบเรียบง่าย ดูง่าย)
   ================================================ */
function genSVG(type){
var w=460,h=180;
function grid(w,h,showBig,showSmall){
var g='';
if(showSmall){for(var x=0;x<=w;x+=9.2)g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="#F5D0D8" stroke-width=".3"/>';
for(var y=0;y<=h;y+=9.2)g+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="#F5D0D8" stroke-width=".3"/>';}
if(showBig){for(var x=0;x<=w;x+=46)g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="#E8A0B0" stroke-width=".6"/>';
for(var y=0;y<=h;y+=46)g+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="#E8A0B0" stroke-width=".6"/>';}
return g;}
function nsrPath(startX,mid,amp,beatW,beats){
var p='';
for(var b=0;b<(beats||6);b++){
var x0=startX+b*beatW;
p+=' M'+(x0)+','+mid+' Q'+(x0+beatW*.08)+','+(mid-amp*.12)+' '+(x0+beatW*.16)+','+mid;
p+=' L'+(x0+beatW*.22)+','+mid;
p+=' L'+(x0+beatW*.24)+','+(mid+amp*.08);
p+=' L'+(x0+beatW*.28)+','+(mid-amp*.5);
p+=' L'+(x0+beatW*.32)+','+(mid+amp*.15);
p+=' L'+(x0+beatW*.42)+','+mid;
p+=' Q'+(x0+beatW*.52)+','+(mid-amp*.18)+' '+(x0+beatW*.62)+','+mid;
p+=' L'+(x0+beatW)+','+mid;
}
return p;}
function spike(x,mid){return ' L'+(x-14)+','+mid+' L'+(x-3)+','+mid+' L'+x+','+(mid-34)+' L'+(x+3)+','+(mid+6)+' L'+(x+6)+','+mid+' L'+(x+14)+','+mid;}

var hm=/^hr_n:(\d)(:ans)?$/.exec(type);
if(hm){var k=+hm[1],ans=!!hm[2],bw=46*k,mid=110,lab='';
for(var i=1;i<=k;i++)lab+='<rect x="'+(46*i+3)+'" y="30" width="40" height="16" rx="3" fill="#fff" stroke="#E8396B" stroke-width=".8"/><text x="'+(46*i+23)+'" y="42" text-anchor="middle" font-size="11" fill="#E8396B" class="anno">'+i+'</text>';
return '<svg viewBox="0 0 '+w+' '+h+'">'+grid(w,h,true,true)+
'<path d="'+nsrPath(-.28*bw+46,mid,100,bw,Math.ceil(460/bw)+1)+'" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/>'+
'<line x1="46" y1="20" x2="46" y2="'+h+'" stroke="#E8396B" stroke-width="1.5" stroke-dasharray="4 2"/>'+
'<line x1="'+(46+bw)+'" y1="20" x2="'+(46+bw)+'" y2="'+h+'" stroke="#E8396B" stroke-width="1.5" stroke-dasharray="4 2"/>'+
(ans?lab:'')+'<text x="'+(46+bw/2)+'" y="16" text-anchor="middle" font-size="10" fill="#E8396B" class="anno">R–R = '+(ans?k:'?')+' ช่องใหญ่</text>'+
'<rect x="270" y="150" width="180" height="24" rx="4" fill="#fff" stroke="#E8396B"/>'+
'<text x="360" y="167" text-anchor="middle" font-size="12" fill="#E8396B" font-weight="700" class="anno">'+(ans?'HR = 300 ÷ '+k+' = '+(300/k):'HR = ?')+'</text>'+
'</svg>';}
if(type==='paper_small_q'||type==='paper_small_ans'){var a2=type==='paper_small_ans';
return '<svg viewBox="0 0 '+w+' 120">'+grid(w,120,true,true)+
'<rect x="92" y="46" width="9.2" height="9.2" fill="#E8396B" opacity=".35" stroke="#E8396B" stroke-width="1.5"/>'+
'<line x1="92" y1="70" x2="101.2" y2="70" stroke="#0E8A5F" stroke-width="3"/>'+
'<text x="110" y="74" class="anno" font-size="11" fill="#0E8A5F">1 ช่องเล็กกว้าง '+(a2?'= 0.04 วินาที':'= ? วินาที')+'</text>'+
'<line x1="92" y1="95" x2="138" y2="95" stroke="#2E86C1" stroke-width="3"/>'+
'<text x="146" y="99" class="anno" font-size="10" fill="#2E86C1">1 ช่องใหญ่ = 5 ช่องเล็ก'+(a2?' = 0.20 วินาที':'')+'</text>'+
'<text x="10" y="20" class="anno" font-size="10" fill="#555">ความเร็วกระดาษ 25 mm/sec → 25 ช่องเล็กต่อ 1 วินาที</text>'+
'</svg>';}
if(type==='paper_big_q'||type==='paper_big_ans'){var a3=type==='paper_big_ans';
return '<svg viewBox="0 0 '+w+' 120">'+grid(w,120,true,true)+
'<rect x="92" y="46" width="46" height="46" fill="#E8396B" opacity=".12" stroke="#E8396B" stroke-width="1.5"/>'+
'<line x1="80" y1="46" x2="80" y2="92" stroke="#0E8A5F" stroke-width="3"/>'+
'<line x1="74" y1="46" x2="86" y2="46" stroke="#0E8A5F" stroke-width="2"/><line x1="74" y1="92" x2="86" y2="92" stroke="#0E8A5F" stroke-width="2"/>'+
'<text x="150" y="66" class="anno" font-size="11" fill="#0E8A5F">สูง 5 ช่องเล็ก '+(a3?'= 5 × 0.1 = 0.5 mV':'= ? mV')+'</text>'+
'<text x="150" y="84" class="anno" font-size="10" fill="#555">1 ช่องเล็ก (แนวตั้ง) = 0.1 mV</text>'+
'</svg>';}
if(type==='rate_cmp'){

let _seed = (Date.now() % 2147483646) + 1;
function RNG() { _seed = (_seed * 48271) % 2147483647; return (_seed - 1) / 2147483646; }
function seedRNG(s) { _seed = (Math.abs(Math.floor(s)) % 2147483646) + 1; for (let i = 0; i < 5; i++) RNG(); }

// ---------- waveform ----------
const g = (x, c, s) => Math.exp(-((x - c) ** 2) / (2 * s * s));
function makeStrip(o) {
  const S = Object.assign({ n: 20, pr: 0.16, qrs: 0.08, r0: 0.6, kind: 'nsr', pAmp: 0.15, irregular: false, pShape: 'normal' }, o);
  S.pWidth = S.pShape === 'wide' ? 0.14 : 0.10;
  // ---- T / QT / U ----
  S.tShape = S.tShape || 'normal';
  const qtb = Math.sqrt(S.n * 0.04 / 0.8);
  S.tSig = (S.tShape === 'peaked' ? 0.028 : 0.05) * qtb;
  S.tAmp = { normal: 0.3, peaked: 0.75, inverted: -0.28, flat: 0.06 }[S.tShape];
  S.tc = S.qt ? S.qt - 2.2 * S.tSig : S.qrs + 0.225 * qtb;     // ระยะจากต้น QRS ถึงยอด T
  S.qt = +(S.tc + 2.2 * S.tSig).toFixed(2);                      // ต้น QRS → จบ T
  S.uAmp = S.uAmp || 0;
  S.st = S.st || 0;                                              // ST ยก (+) / กด (−) หน่วย mV (0.1 mV = 1 มม.)
  S.uc = S.qt + 0.07;                                            // ยอด U หลังจบ T
  S.rr = S.n * 0.04; S.rate = Math.round(1500 / S.n);
  // ให้มีเส้นฐานคั่นระหว่าง "จบ T" กับ "ต้น P" อย่างน้อย 1.5 ช่องเล็ก จะได้วัด PR ได้ชัด
  {
    const shortRR = S.irregular ? S.rr * 0.65 : S.rr;          // จังหวะไม่สม่ำเสมอใช้ช่วงที่สั้นที่สุด
    const maxQt = +(shortRR - S.pr - 0.06).toFixed(2);
    if (S.qt > maxQt && maxQt >= 0.24) { S.qt = maxQt; S.tc = S.qt - 2.2 * S.tSig; }

const sgm = z => 1 / (1 + Math.exp(-z));
function volt(S, t) {

const seg = (p, i, n) => Math.max(0, Math.min(1, p * n - i));   // sequential sub-progress
const visibleR = () => S.R.filter(r => r < DUR - 0.1);

// overlays: (p 0..1) animated progress
const OV = {
  paper(p) {
    const m = css('--c-m');
    ctx.globalAlpha = seg(p, 0, 3);
    ctx.fillStyle = m; ctx.globalAlpha *= .35; ctx.fillRect(20 * PX, 3 * PX, PX, PX); ctx.globalAlpha = seg(p, 0, 3);

    bracket(0, 1, 32, m, '5 ช่องใหญ่ = 1 วินาที');
    ctx.globalAlpha = 1;
  },
  waves(p) {
    const R = S.R[1];
    const items = [
      [...waveRange(S, R, 'P'), '--c-p', 'P · หัวใจห้องบนบีบ'],
      [...waveRange(S, R, 'QRS'), '--c-qrs', 'QRS · ห้องล่างบีบ'],

    items.forEach(([a, b, c, t], i) => {

      label(t, X((a + b) / 2), Ymm(3 + i * 5), css(c));
    });
    ctx.globalAlpha = 1;
  },
  rate(p) {
    const m = css('--c-m'), qc = css('--c-qrs'), R1 = S.R[1], R2 = S.R[2];
    visibleR().forEach(r => dot(r, volt(S, r), qc, 4));
    vline(R1, qc); vline(R2, qc);
    const L = S.rr / 0.2, whole = Math.floor(L + 1e-6), shown = Math.floor(seg(p, 0, 1.3) * whole + 1e-6);
    ctx.strokeStyle = m; ctx.lineWidth = 2;
    for (let k = 1; k <= shown; k++) {
      const a = R1 + (k - 1) * .2, b = R1 + k * .2;
      ctx.fillStyle = m; ctx.globalAlpha = .14; ctx.fillRect(X(a), Ymm(5), X(b) - X(a), Ymm(5)); ctx.globalAlpha = 1;
      label(String(k), X((a + b) / 2), Ymm(7.5), m);
    }
    if (p > .8) {
      ctx.globalAlpha = seg(p, 4, 5);
      const txt = S.n % 5 === 0
        ? `${whole} ช่องใหญ่ → 300 ÷ ${whole} = ${S.rate} ครั้ง/นาที`
        : `${S.n} ช่องเล็ก → 1500 ÷ ${S.n} ≈ ${S.rate} ครั้ง/นาที`;
      label(txt, X(R2) + 8, Ymm(31), m, 'left'); ctx.globalAlpha = 1;
    }
  },
  rhythm(p) {
    const m = css('--c-m'), qc = css('--c-qrs'), rs = visibleR();
    rs.forEach(r => dot(r, volt(S, r), qc, 4));
    for (let i = 0; i < rs.length - 1; i++) {
      ctx.globalAlpha = seg(p, i, rs.length - 1);
      bracket(rs[i], rs[i + 1], 8, m, `${(rs[i + 1] - rs[i]).toFixed(2)} s`);
    }
    ctx.globalAlpha = 1;
  },
  pwave(p) {
    const c = css('--c-p');
    visibleR().forEach((R, i, a) => {
      ctx.globalAlpha = seg(p, i, a.length);
      const [x0, x1] = waveRange(S, R, 'P');       // ขอบเขตจริงของ P (ต้น–ปลาย)
      const pc = (x0 + x1) / 2;
      bracket(x0, x1, 29, c);                       // ขีดต้น–ปลาย P ใต้เส้นฐาน ไม่ทับคลื่นอื่น
      const ph = S.pShape === 'wide' ? 0.13 : S.pAmp;
      label(S.pShape === 'wide' ? 'P กว้าง' : S.pAmp > 0.2 ? 'P สูง' : S.pAmp > 0 ? 'P' : S.pAmp < 0 ? 'P กลับหัว' : 'ไม่มี P', X(pc), Y(Math.max(ph, .08)) - 3.8 * PX, c);
    });

  },
  pr(p) {
    const c = css('--c-p'), R = S.R[1], o = on(S, R), a = o - S.pr;
    ctx.globalAlpha = seg(p, 0, 3); band(a, o, c, .2); vline(a, c); vline(o, c);
    ctx.globalAlpha = seg(p, 1, 3);
    const pc = a + (S.pShape === 'wide' ? 0.07 : 0.05);          // ยอด P
    dot(pc, volt(S, pc), c, 4);
    label('ต้น P', X(a), Ymm(6), c);
    label('ต้น QRS', X(o), Ymm(33), c);
    ctx.globalAlpha = seg(p, 2, 3);
    bracket(a, o, 30, c, `PR = ${S.pr.toFixed(2)} s (${fmt(S.pr / .04)} ช่องเล็ก)`);
    ctx.globalAlpha = 1;
  },
  qrs(p) {
    const c = css('--c-qrs'), R = S.R[1], o = on(S, R);
    ctx.globalAlpha = seg(p, 0, 2); band(o, o + S.qrs, c, .22); vline(o, c); vline(o + S.qrs, c);
    ctx.globalAlpha = seg(p, 1, 2);
    bracket(o, o + S.qrs, 30, c, `QRS = ${S.qrs.toFixed(2)} s (${fmt(S.qrs / .04)} ช่องเล็ก)`);
    ctx.globalAlpha = 1;
  },
  twave(p) {
    const c = css('--c-t'), txt = { normal: 'T ปกติ: โค้งมน หัวขึ้น สูง ≈ 3 ช่องเล็ก', peaked: 'T สูงแหลม ฐานแคบ', inverted: 'T กลับหัว', flat: 'T แบน สูงไม่ถึง 1 ช่องเล็ก' }[S.tShape];
    visibleR().forEach((R, i, a) => {
      if (R + 0.5 > DUR) return;
      ctx.globalAlpha = seg(p, i, a.length);
      const [x0, x1] = waveRange(S, R, 'T');
      band(x0, x1, c, .22);
    });
    ctx.globalAlpha = seg(p, 0, 1);
    const [a0, a1] = waveRange(S, S.R[1], 'T');
    label(txt, X((a0 + a1) / 2), Ymm(4), c);
    if (S.tShape !== 'flat') {
      const hmm = Math.round(Math.abs(S.tAmp) * 10), y1 = BASE - S.tAmp * 10;
      const tx = S.R[1] - 0.45 * S.qrs + S.tc + 0.07;
      vbracket(tx, Math.min(y1, BASE), Math.max(y1, BASE), c, '');
      label(`${S.tAmp < 0 ? 'ลึก' : 'สูง'} ≈ ${hmm} มม. (${hmm} ช่องเล็ก)`, X(tx) + 8,
        Ymm(S.tAmp < 0 ? Math.max(y1, BASE) + 4 : Math.min(y1, BASE) - 4), c, 'left');
    }
    ctx.globalAlpha = 1;
  },
  qt(p) {
    const c = '#8E44AD', R1 = S.R[1], o = on(S, R1), e = o + S.qt;
    ctx.globalAlpha = seg(p, 0, 3); band(o, e, c, .15); vline(o, c); vline(e, c);
    ctx.globalAlpha = seg(p, 1, 3);
    bracket(o, e, 30, c, `QT = ${S.qt.toFixed(2)} s (${fmt(S.qt / .04)} ช่องเล็ก)`);
    ctx.globalAlpha = seg(p, 2, 3);
    const rr = S.R[2] - S.R[1];
    bracket(R1, R1 + rr / 2, 6, cM2(), `ครึ่ง R–R = ${(rr / 2).toFixed(2)} s`);
    ctx.globalAlpha = 1;
  },
  uwave(p) {
    const c = '#D68910';
    visibleR().forEach((R, i, a) => {
      if (R + 0.7 > DUR) return;
      ctx.globalAlpha = seg(p, i, a.length);
      const [u0, u1] = waveRange(S, R, 'U'), uc = (u0 + u1) / 2;
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath();
      ctx.ellipse(X(uc), Y(Math.max(S.uAmp, 0.04) / 2), 2.6 * PX, 2 * PX, 0, 0, 7); ctx.stroke();
      if (i === 1) label(S.uAmp ? (S.uAmp >= 0.1 ? 'U เด่น' : 'U เล็ก') : 'ไม่มี U', X(uc), Ymm(12), c);
    });

  },
  st(p) {
    const c = '#B9770E', R1 = S.R[1], o = on(S, R1), j = o + S.qrs, m = j + 0.04;
    const base = volt(S, o - 0.02), lv = volt(S, m) - base, mm = Math.round(Math.abs(lv) * 20) / 2;
    ctx.globalAlpha = seg(p, 0, 3);
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = css('--c-p'); ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(0, Y(base)); ctx.lineTo(W, Y(base)); ctx.stroke(); ctx.restore();
    label('เส้นฐาน (ระดับ PR segment)', X(o - S.pr) - 4, Y(base) + 22, css('--c-p'), 'right');
    ctx.globalAlpha = seg(p, 1, 3);
    visibleR().forEach(R => { if (R + 0.4 > DUR) return; const a = on(S, R) + S.qrs; band(a, on(S, R) + S.tc - S.tSig, c, .22); });
    dot(j, volt(S, j), c, 4.5);
    label('J point', X(j), Ymm(BASE - volt(S, j) * 10 + (lv < 0 ? -9 : 9)), c);
    ctx.globalAlpha = seg(p, 2, 3);
    if (mm >= 0.5) vbracket(m, BASE - base * 10, BASE - (base + lv) * 10, c, '');
    label(mm < 0.5 ? 'ST อยู่ระดับเส้นฐาน — ปกติ' : `ST ${lv > 0 ? 'ยก' : 'กด'} ≈ ${fmt(mm)} มม. (${fmt(mm)} ช่องเล็ก)`,
      X(m) + 10, Ymm(lv > 0 ? BASE - (base + lv) * 10 - 8 : 30), c, 'left');

  },
  summary(p) {

    ctx.globalAlpha = seg(p, 1, 3); OV.pr(1);
    ctx.globalAlpha = seg(p, 2, 3); OV.rhythm(1);
    ctx.globalAlpha = 1;
  },
  none() {}
};
const cM2 = () => css('--c-m');
const fmt = n => (Math.round(n * 10) / 10).toString();

// ---------- animation loop ----------
let sweepStart = 0, sweeping = false, overlay = 'none', ovStart = 0, raf = 0;
const SPEED = 2, OVMS = 1700;
function play() { sweepStart = performance.now(); sweeping = !reduce; ovStart = 0; kick(); }
function setOverlay(name) { overlay = name; ovStart = sweeping ? 0 : performance.now(); kick(); }
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0; grid();
  let upto = W;
  if (sweeping) {
    upto = X((now - sweepStart) / 1000 * SPEED);
    if (upto >= W) { sweeping = false; upto = W; ovStart = now; }
  }
  trace(upto);
  let more = sweeping;
  if (!sweeping && overlay !== 'none') {
    const p = reduce ? 1 : Math.min(1, (now - ovStart) / OVMS);
    ctx.save(); (typeof overlay === 'function' ? overlay : OV[overlay])(p); ctx.restore();
    if (p < 1) more = true;
  }
  if (more) raf = requestAnimationFrame(frame);
}
document.getElementById('replay').onclick = play;
new ResizeObserver(resize).observe(box);


const pick = a => a[Math.floor(RNG() * a.length)];
const rint = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ===== อ่านกราฟเต็ม: ชนิดกราฟที่สุ่ม ===== */
const DX = {
  nsr: 'Normal sinus rhythm',
  brady: 'Sinus bradycardia',
  tachy: 'Sinus tachycardia',
  sa: 'Sinus arrhythmia',
  pr: 'Sinus rhythm + 1st degree AV block (PR ยาว)',
  qrs: 'Sinus rhythm + QRS กว้าง (เช่น bundle branch block)',
  junc: 'Junctional rhythm'
};
function genStrip(kinds) {
  const r = RNG();
  let kind = r < .30 ? 'nsr' : r < .42 ? 'brady' : r < .54 ? 'tachy' : r < .66 ? 'sa' : r < .77 ? 'pr' : r < .88 ? 'qrs' : 'junc';
  if (kinds) kind = pick(kinds);
  const o = { kind, pr: pick([0.14, 0.16, 0.18]), qrs: pick([0.06, 0.08, 0.10]), n: rint(16, 24) };
  if (kind === 'brady') o.n = rint(28, 38);
  if (kind === 'tachy') { o.n = rint(12, 13); o.pr = pick([0.12, 0.14]); o.qt = +(0.40 * Math.sqrt(o.n * 0.04)).toFixed(2); o.pAmp = 0.22; }
  if (kind === 'sa') { o.n = rint(21, 25); o.irregular = true; }
  if (kind === 'pr') { o.n = rint(17, 24); o.pr = pick([0.24, 0.28, 0.32]); }
  if (kind === 'qrs') { o.n = rint(17, 24); o.qrs = pick([0.12, 0.14, 0.16]); }
  if (kind === 'junc') { o.n = rint(27, 32); o.pAmp = pick([0, -0.12]); o.pr = 0.08; o.qrs = pick([0.06, 0.08]); }
  const S = makeStrip(o);
  S.count6 = S.R.filter(x => x < DUR - 0.05).length;
  S.hr = S.irregular ? S.count6 * 10 : S.rate;
  return S;
}

const f2s = v => v.toFixed(2);
const boxes = v => fmt(v / 0.04);
const qrsLabel = q => `${f2s(q)} วินาที (${boxes(q)} ช่องเล็ก) — ${q >= 0.12 ? 'กว้าง ผิดปกติ' : 'แคบ ปกติ'}`;
const prLabel = p => `${f2s(p)} วินาที (${boxes(p)} ช่องเล็ก) — ${p < 0.12 ? 'สั้นกว่าปกติ' : p <= 0.2 ? 'ปกติ' : 'ยาวกว่าปกติ'}`;
const hrLabel = v => `${v} ครั้ง/นาที — ${v < 60 ? 'ช้า (< 60)' : v > 100 ? 'เร็ว (> 100)' : 'ปกติ (60–100)'}`;
const NO_P = 'วัดไม่ได้ — ไม่มี P นำหน้า QRS';

// ตัวเลือกแบบตัวเลข: ค่าจริง 1 ข้อ + ค่าหลอก (แต่ละข้อมีคำแปลผลของตัวเอง)
function valueOpts(correct, pool, labelFn, k, minGap) {
  const out = correct == null ? [] : [correct];
  for (const v of shuffle(pool.slice())) {
    if (out.length >= k) break;
    if (v > 0 && out.every(o => Math.abs(o - v) >= minGap - 1e-9)) out.push(+v.toFixed(2));
  }
  return out.map(v => [labelFn(v), v === correct]);
}

function buildQs(S, kinds) {
  const noP = S.pAmp === 0, invP = S.pAmp < 0;

  // 1) Rhythm
  const q1 = { tag: 'จังหวะ (Rhythm)', q: 'ระยะ R–R สม่ำเสมอหรือไม่?', ov: 'rhythm',
    opts: shuffle([
      ['สม่ำเสมอ (Regular) — R–R ห่างเท่ากันทุกช่วง', !S.irregular],
      ['ไม่สม่ำเสมอ (Irregular) — R–R ยาวสั้นไม่เท่ากัน', !!S.irregular],
      ['สม่ำเสมอ แต่มีช่วงหยุดยาว (pause) 1 ครั้ง', false]]),
    ex: S.irregular ? 'ระยะ R–R แต่ละช่วงยาวไม่เท่ากัน (ดูตัวเลขบนขีดเขียว) → Irregular'
                    : `ระยะ R–R เท่ากันทุกช่วง = ${f2s(S.rr)} วินาที → Regular` };

  // 2) P wave
  const q2 = { tag: 'P wave', q: 'P wave มีลักษณะอย่างไร?', ov: 'pwave',
    opts: shuffle([
      ['ตั้งขึ้น หน้าตาเหมือนกัน นำหน้า QRS ทุกตัว · กว้าง ≈ 0.10 วินาที สูง ≈ 1.5 มม. (1.5 ช่องเล็ก) — ปกติ (sinus)', !noP && !invP],
      ['กลับหัว (ลงใต้เส้นฐาน) นำหน้า QRS — ไม่ใช่ sinus', invP],
      ['มองไม่เห็น P หน้า QRS — ไม่ใช่ sinus', noP],
      ['ตั้งขึ้น แต่สูงแหลม > 2.5 มม. (2.5 ช่องเล็ก) — ผิดปกติ', false]]),
    ex: noP ? 'ช่วงก่อน QRS เป็นเส้นเรียบ ไม่มี P → ไฟฟ้าไม่ได้เริ่มจาก SA node'
      : invP ? 'P กลับหัวใน lead II → ไฟฟ้าเริ่มจากบริเวณ AV junction ไม่ใช่ SA node'
      : 'P ตั้งขึ้น กว้างราว 2.5 ช่องเล็ก (0.10 วินาที) สูง 1.5 ช่องเล็ก (1.5 มม.) มีทุกบีต → sinus' };

  // 3) QRS
  const q3 = { tag: 'QRS', q: 'QRS กว้างเท่าไร แคบหรือกว้าง?', ov: 'qrs',
    opts: shuffle(valueOpts(S.qrs, [0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.20], qrsLabel, 4, 0.04)),
    ex: `QRS กว้าง ${boxes(S.qrs)} ช่องเล็ก × 0.04 = ${f2s(S.qrs)} วินาที → ${S.qrs >= 0.12 ? 'กว้าง (≥ 0.12)' : 'แคบ ปกติ (< 0.12)'}` };

  // 4) PR
  const prPool = [0.08, 0.12, 0.16, 0.20, 0.24, 0.28, 0.32];
  const prGap = 0.06;      // ตัวเลือก PR ห่างกันอย่างน้อย 1.5 ช่องเล็ก
  const prOpts = noP
    ? valueOpts(null, prPool, prLabel, 3, prGap).concat([[NO_P, true]])
    : valueOpts(S.pr, prPool.concat([0.14, 0.18]), prLabel, 3, prGap).concat([[NO_P, false]]);
  const q4 = { tag: 'PR interval', q: 'PR interval เท่าไร?', ov: noP ? 'pwave' : 'pr',
    opts: shuffle(prOpts),
    ex: noP ? 'ไม่มี P จึงวัด PR ไม่ได้'
      : `ต้น P ถึงต้น QRS = ${boxes(S.pr)} ช่องเล็ก × 0.04 = ${f2s(S.pr)} วินาที → ${S.pr < 0.12 ? 'สั้น (< 0.12)' : S.pr <= 0.2 ? 'ปกติ (0.12–0.20)' : 'ยาว (> 0.20)'}` };

  // 5) HR
  const c = S.hr;
  const hrPool = S.irregular
    ? [c + 10, c - 10, c + 20, c - 20, S.count6 * 6, c + 30]
    : [c + 15, c - 15, c + 25, c - 25, Math.round(1500 / (S.n + 5)), Math.round(1500 / Math.max(8, S.n - 5)), Math.round(300 / Math.max(1, Math.round(S.n / 5)))];
  const q5 = { tag: 'อัตราการเต้น (HR)', q: S.irregular ? 'HR ประมาณเท่าไร? (จังหวะไม่สม่ำเสมอ ใช้วิธี 6 วินาที)' : 'HR เท่าไร?',
    ov: S.irregular ? 'rate6' : 'rate',
    opts: shuffle(valueOpts(c, hrPool.map(Math.round), hrLabel, 4, 10)),
    ex: S.irregular ? `กราฟยาว 6 วินาที นับ QRS ได้ ${S.count6} ตัว → ${S.count6} × 10 ≈ ${c} ครั้ง/นาที`
      : `R–R ห่าง ${S.n} ช่องเล็ก${S.n % 5 === 0 ? ` (${S.n / 5} ช่องใหญ่ → 300 ÷ ${S.n / 5})` : ` (${fmt(S.n / 5)} ช่องใหญ่)`} → 1500 ÷ ${S.n} ≈ ${c} ครั้ง/นาที` };

  // 6) Summary
  let others = shuffle(Object.keys(DX).filter(k => k !== S.kind));
  if (kinds) others = kinds.filter(k => k !== S.kind).concat(others.filter(k => !kinds.includes(k)));
  else if (S.kind !== 'nsr') { others.splice(others.indexOf('nsr'), 1); others.unshift('nsr'); }
  const keys = shuffle([S.kind, ...others.slice(0, 3)]);
  const q6 = { tag: 'สรุปกราฟ', q: 'รวมทุกข้อแล้ว กราฟนี้คืออะไร?', ov: S.pAmp === 0 ? 'rhythm' : 'summary',
    opts: keys.map(k => [DX[k], k === S.kind]),
    ex: summaryEx(S) };

  // รวม Rhythm + HR เป็นข้อเดียว (กราฟละ 5 ข้อ)
  const rTxt = r => r ? 'ไม่สม่ำเสมอ (Irregular)' : 'สม่ำเสมอ (Regular)';
  const hrVals = q5.opts.map(o => +o[0].split(' ')[0]).filter(v => v !== c);
  const irr = !!S.irregular;

    const k = kind === 'none2' ? 'none' : kind;
    const S = makeStrip({ n: rint(24, 28), tShape: k === 'hypok' ? 'flat' : 'normal', uAmp: k === 'small' ? 0.06 : k === 'hypok' ? 0.2 : 0 });
    const L = {
      none: 'ไม่มี U wave — หลัง T เป็นเส้นเรียบ',
      small: 'มี U เล็ก ๆ หลัง T ปกติ — พบได้ในคนปกติ',
      hypok: 'T แบน + U เด่น (สูงกว่า T) — นึกถึงโพแทสเซียมต่ำ',
      tall: 'มี U สูงกว่า T และ T สูงแหลม — นึกถึงโพแทสเซียมสูง'
    };
    return { S, q: 'ช่วงหลัง T wave (แถบที่ไฮไลต์) เห็นอะไร?',
      opts: shuffle(Object.keys(L).map(key => [L[key], key === k])),
      draw: () => { visibleR().forEach(R => { if (R + 0.7 > DUR) return; const [a, b] = waveRange(S, R, 'U'); band(a, b, cM(), .15); }); },
      reveal: 'uwave',
      ex: { none: 'หลัง T กลับสู่เส้นฐานเลย ไม่มีคลื่นเพิ่ม → ไม่มี U wave',
            small: 'มีคลื่นเล็ก ๆ ทิศเดียวกับ T สูงไม่ถึง 1 มม. (1 ช่องเล็ก) → U wave ปกติ (พบบ่อยเมื่อ HR ช้า)',
            hypok: 'T เตี้ยแบน แต่ U สูงเด่นกว่า T → รูปแบบของโพแทสเซียมต่ำ รายงานแพทย์ ตรวจเกลือแร่',
            tall: '' }[k] };
  },
  // 12: ST segment
  () => {
    const kind = pick(['normal', 'elev', 'elev', 'depr', 'depr']);
    const st = kind === 'normal' ? 0 : kind === 'elev' ? pick([0.1, 0.2, 0.3]) : pick([-0.1, -0.15, -0.2]);
    const S = makeStrip({ n: rint(18, 26), qrs: pick([0.06, 0.08]), qt: 0.36, st });
    const mm = Math.round(Math.abs(st) * 100) / 10;
    const mode = pick(['type', 'type', 'mm', 'act']);
    const draw = 'stQ', reveal = 'st';
    if (mode === 'mm' && kind !== 'normal') {
      const pool = [0.5, 1, 1.5, 2, 3, 4].filter(v => v !== mm);
      const vals = [mm, ...shuffle(pool).slice(0, 3)];
      const L = v => `${kind === 'elev' ? 'ยก' : 'กด'} ≈ ${fmt(v)} มม. (${fmt(v)} ช่องเล็ก)`;
      return { S, q: `ST ${kind === 'elev' ? 'ยกขึ้น' : 'กดลง'}จากเส้นฐานประมาณเท่าไร? (วัดหลัง J point 1 ช่องเล็ก)`,
        opts: shuffle(vals.map(v => [L(v), v === mm])), draw, reveal,
        ex: `นับจากเส้นฐาน (ระดับ PR segment) ถึงระดับ ST ได้ ${fmt(mm)} ช่องเล็ก = ${fmt(mm)} มม. (${fmt(Math.abs(st))} mV) → ${kind === 'elev' ? (mm >= 1 ? 'ST ยก ≥ 1 มม.' : 'ST ยกเล็กน้อย') : (mm >= 0.5 ? 'ST กด ≥ 0.5 มม.' : 'ST กดเล็กน้อย')}` };
    }
    if (mode === 'act') {
      const A = {
        normal: 'ST ปกติ — บันทึกผล ดูแลตามปกติ',
        elev: 'ST ยก — แจ้งแพทย์/ทีมทันที ทำ EKG 12 lead ภายใน 10 นาที',
        depr: 'ST กด — รายงานแพทย์ ทำ EKG 12 lead ประเมินอาการเจ็บหน้าอก',
        wait: 'ST ยก — รอดูกราฟอีก 1 ชั่วโมงค่อยรายงาน'
      };
      return { S, q: 'ผู้ป่วยบ่นแน่นหน้าอก ดู ST ในกราฟนี้แล้ว ควรทำอย่างไร?',
        opts: shuffle(Object.keys(A).map(k => [A[k], k === kind])), draw, reveal,
        ex: { normal: 'ST อยู่ระดับเส้นฐาน แต่ถ้ายังเจ็บหน้าอกก็ต้องทำ EKG 12 lead และรายงานตามอาการ',
              elev: `ST ยก ${fmt(mm)} มม. (${fmt(mm)} ช่องเล็ก) + เจ็บหน้าอก → สงสัย STEMI ห้ามรอ แจ้งทันทีตามแนวทาง STEMI fast track`,
              depr: `ST กด ${fmt(mm)} มม. (${fmt(mm)} ช่องเล็ก) + เจ็บหน้าอก → สงสัยกล้ามเนื้อหัวใจขาดเลือด รายงานแพทย์` }[kind] };
    }
    const L = { normal: 'ST อยู่ระดับเส้นฐาน — ปกติ', elev: 'ST ยกขึ้นเหนือเส้นฐาน — ผิดปกติ', depr: 'ST กดลงใต้เส้นฐาน — ผิดปกติ', t: 'T กลับหัว (ST ปกติ)' };
    return { S, q: 'ST segment (แถบสีส้ม) อยู่ระดับไหนเมื่อเทียบกับเส้นฐาน?',
      opts: shuffle(Object.keys(L).map(k => [L[k], k === kind])), draw, reveal,
      ex: { normal: 'ช่วงหลัง QRS ถึงต้น T อยู่ระดับเดียวกับ PR segment → ST ปกติ',
            elev: `ช่วงหลัง J point สูงกว่าเส้นฐาน ${fmt(mm)} ช่องเล็ก (${fmt(mm)} มม.) → ST ยก`,
            depr: `ช่วงหลัง J point ต่ำกว่าเส้นฐาน ${fmt(mm)} ช่องเล็ก (${fmt(mm)} มม.) → ST กด` }[kind] };
  }
];

  { type: 'drill', ex: 2, n: 5, title: 'แบบทดสอบท้ายบท: ฝึกนับ HR บนกราฟจริง', hint: 'มีทั้งวิธี 300 (R ตกเส้นหนา), วิธี 1500 (นับช่องเล็ก) และวิธี 6 วินาที (จังหวะไม่สม่ำเสมอ)' }
]},
{ id: 'rhythm', title: 'จังหวะสม่ำเสมอไหม (Rhythm)', desc: 'วัดระยะ R–R', pages: [
  { type: 'content', title: 'Regular vs Irregular', svg: 'rhythm_cmp',
    body: '<p>วัดระยะ R–R ทุกคู่ ถ้าเท่ากัน (ต่างกันไม่เกินราว 0.12 วินาที = 3 ช่องเล็ก) คือ <strong>สม่ำเสมอ</strong></p>' + HL('💡 เคล็ดลับ: ใช้ขอบกระดาษจุดตำแหน่ง R สองตัว แล้วเลื่อนเทียบคู่อื่น') },
  { type: 'content', title: 'ดูบนกราฟจริง', strip: 'rhythm', body: '<p>ขีดสีเขียวแต่ละช่วงคือระยะ R–R ของกราฟนี้เท่ากันหมด = <strong>regular</strong></p>' },
  { type: 'drill', ex: 3, n: 5, title: 'แบบทดสอบท้ายบท: ฝึกดูจังหวะบนกราฟจริง', hint: 'ดูจุด R แล้วเทียบระยะห่างแต่ละช่วง' }
]},
{ id: 'pwave', title: 'ดู P wave', desc: 'sinus หรือไม่', pages: [
  { type: 'content', title: 'P แบบไหนคือ sinus?', svg: 'p_cmp',
    body: K('ถามตัวเอง 3 ข้อ:<br>📌 มี P นำหน้า QRS ทุกตัวไหม<br>📌 P 1 ตัว : QRS 1 ตัว เสมอไหม<br>📌 P หน้าตาเหมือนกัน และตั้งขึ้นใน lead II ไหม') + '<p>ใช่ทั้งหมด → ไฟฟ้าเริ่มจาก SA node = <strong>sinus rhythm</strong></p>' },
  { type: 'content', title: 'ดูบนกราฟจริง', strip: 'pwave', body: '<p>วงกลมสีฟ้าคือ P ทุกตัว ตั้งขึ้น หน้าตาเหมือนกัน นำหน้า QRS ทุกตัว</p>' },
  { type: 'drill', ex: 4, n: 5, title: 'แบบทดสอบท้ายบท: ฝึกดู P wave บนกราฟจริง', hint: 'ดูช่วงก่อน QRS แต่ละตัว' }
]},
{ id: 'pr', title: 'วัด PR interval', desc: 'ปกติ 0.12–0.20 วินาที', pages: [
  { type: 'content', title: 'วัดจากไหนถึงไหน?', svg: 'intervals',
    body: '<p>วัดจาก <strong>จุดเริ่ม P</strong> ถึง <strong>จุดเริ่ม QRS</strong> (ไม่ใช่ยอด R)</p>' + K('📌 ปกติ 0.12–0.20 วินาที = 3–5 ช่องเล็ก<br>📌 &gt; 0.20 → 1st degree AV block<br>📌 &lt; 0.12 → นึกถึง pre-excitation (เช่น WPW) หรือจังหวะจาก junction') },
  { type: 'content', title: 'ดูบนกราฟจริง', strip: 'pr', body: '<p>PR ของกราฟนี้ = 4 ช่องเล็ก × 0.04 = <strong>0.16 วินาที</strong> → ปกติ</p>' },
  { type: 'drill', ex: 5, n: 5, title: 'แบบทดสอบท้ายบท: ฝึกวัด PR บนกราฟจริง', hint: 'วัดที่บีตซึ่งลูกศรชี้ นับช่องเล็กจากต้น P ถึงต้น QRS' }
]},
{ id: 'qrs', title: 'วัดความกว้าง QRS', desc: 'แคบหรือกว้าง', pages: [
  { type: 'content', title: 'แคบหรือกว้าง?', svg: 'wave_qrs',
    body: '<p>วัดจากจุดที่ Q เริ่มออกจากเส้นฐาน ถึงจุดที่ S กลับเส้นฐาน (J point)</p>' + K('📌 &lt; 0.12 วินาที (ไม่ถึง 3 ช่องเล็ก) = แคบ ปกติ<br>📌 ≥ 0.12 วินาที = กว้าง → bundle branch block หรือจังหวะจาก ventricle') },
  { type: 'content', title: 'ดูบนกราฟจริง', strip: 'qrs', body: '<p>QRS ของกราฟนี้ = 2 ช่องเล็ก = <strong>0.08 วินาที</strong> → แคบ ปกติ</p>' },
  { type: 'drill', ex: 6, n: 5, title: 'แบบทดสอบท้ายบท: ฝึกวัด QRS บนกราฟจริง', hint: 'วัดบีตที่ลูกศรชี้' }
]},
{ id: 'nsr', title: 'อ่านกราฟเต็ม: Normal Sinus Rhythm', desc: 'รวมทุกขั้น ฝึกจนคล่อง', pages: [
  { type: 'content', title: 'อ่าน EKG 5 ขั้น', svg: 'waves_overview',
    body: HL('1️⃣ Rate 2️⃣ Rhythm 3️⃣ P wave 4️⃣ PR 5️⃣ QRS') + K('Normal sinus rhythm:<br>✓ Rate 60–100<br>✓ สม่ำเสมอ<br>✓ P ตั้งขึ้น นำหน้า QRS ทุกตัว<br>✓ PR 0.12–0.20 วินาที<br>✓ QRS &lt; 0.12 วินาที') },
  { type: 'content', title: 'ดูบนกราฟจริง', strip: 'summary', body: '<p>กราฟนี้ผ่านทั้ง 5 ข้อ: rate 75, สม่ำเสมอ, P ปกติ, PR 0.16, QRS 0.08 → <strong>Normal sinus rhythm</strong></p>' },
  { type: 'practice', n: 10, title: 'แบบทดสอบอ่านกราฟเต็ม (10 กราฟ)' }
]},
{ id: 'brady', title: 'Sinus Bradycardia / Tachycardia', desc: 'sinus ที่ช้าหรือเร็วเกินไป · สาเหตุ · สิ่งที่ต้องทำ', pages: [
  { type: 'content', title: 'ต่างจาก NSR แค่ข้อเดียว: HR', svg: 'rate_cmp',
    body: '<p>ทั้งสองแบบยังเป็น <strong>sinus</strong> ครบทุกข้อ (สม่ำเสมอ, P ตั้งขึ้นนำหน้า QRS ทุกตัว, PR และ QRS ปกติ) ต่างกันที่อัตราการเต้นเท่านั้น</p>'
      + K('🐢 <strong>Sinus bradycardia</strong> — HR &lt; 60 (R–R ห่างเกิน 5 ช่องใหญ่)<br>✅ <strong>Normal sinus rhythm</strong> — HR 60–100 (R–R 3–5 ช่องใหญ่)<br>🐇 <strong>Sinus tachycardia</strong> — HR &gt; 100 (R–R ห่างไม่ถึง 3 ช่องใหญ่)')
      + HL('💡 จำง่าย: R–R <strong>เกิน 5 ช่องใหญ่ = ช้า</strong> · <strong>น้อยกว่า 3 ช่องใหญ่ = เร็ว</strong>') },
  { type: 'content', title: 'Sinus bradycardia บนกราฟจริง', strip: 'rate', stripOpts: { n: 30 },
    body: '<p>R–R ห่าง 6 ช่องใหญ่ → 300 ÷ 6 = <strong>50 ครั้ง/นาที</strong> ส่วนอื่นปกติทั้งหมด</p>'
      + K('📌 <strong>พบได้ปกติ</strong>: นักกีฬา ขณะนอนหลับ<br>📌 <strong>ยา</strong>: beta-blocker, calcium channel blocker, digoxin<br>📌 <strong>โรค</strong>: hypothyroid, hypothermia, ความดันในกะโหลกสูง, กล้ามเนื้อหัวใจขาดเลือด (inferior MI), กระตุ้น vagus (อาเจียน เบ่ง)') },
  { type: 'content', title: 'เจอ bradycardia ต้องทำอะไร?', svg: 'brady_action',
    body: HL('ดู <strong>ผู้ป่วย</strong> ก่อนดูตัวเลข: มีอาการหรือไม่?')
      + K('✅ <strong>ไม่มีอาการ</strong> รู้สึกตัวดี BP ปกติ → วัด vital signs ซ้ำ ทบทวนยา แจ้งพยาบาลหัวหน้าเวร/แพทย์ตามแนวทางหน่วยงาน')
      + '<div class="highlight">🚨 <strong>มีอาการ (unstable)</strong> → ตามทีมทันที · ต่อ monitor · เปิดเส้นให้สารน้ำ · ให้ออกซิเจนถ้า SpO₂ ต่ำ<br>สัญญาณอันตราย: ความดันต่ำ · ซึม/สับสน · หน้ามืดเป็นลม · เจ็บหน้าอก · หัวใจล้มเหลวเฉียบพลัน</div>'
      + '<p style="font-size:.78rem;color:#8A7A80">การให้ยา (เช่น atropine) หรือ pacing เป็นไปตามแผนการรักษาของแพทย์และแนวทาง ACLS ของหน่วยงาน</p>' },
  { type: 'content', title: 'Sinus tachycardia บนกราฟจริง', strip: 'rate', stripOpts: { n: 12, pr: 0.14 },
    body: '<p>R–R ห่าง <strong>12 ช่องเล็ก</strong> (ไม่ถึง 3 ช่องใหญ่) → 1500 ÷ 12 = <strong>125 ครั้ง/นาที</strong></p>'
      + HL('👀 ยิ่งเร็ว P ยิ่งชิดกับ T ของบีตก่อนหน้า ต้องมองหา P ให้เจอทุกตัว')
      + K('📌 <strong>สาเหตุที่พบบ่อย</strong> (ร่างกายตอบสนองต่อบางอย่าง): ไข้ ปวด กังวล ขาดน้ำ/เสียเลือด ซีด ออกซิเจนต่ำ ติดเชื้อรุนแรง ไทรอยด์เป็นพิษ ยา (salbutamol) คาเฟอีน') },
  { type: 'content', title: 'เจอ tachycardia ต้องทำอะไร?', svg: 'tachy_action',
    body: HL('💡 Sinus tachycardia <strong>ไม่ใช่โรค</strong> แต่เป็นสัญญาณว่ามีบางอย่างผิดปกติ → <strong>หาสาเหตุและแก้ที่สาเหตุ</strong>')
      + K('✅ วัดไข้ ประเมินความปวด ดูภาวะขาดน้ำ/เสียเลือด วัด SpO₂ ทบทวนยา แล้วรายงานแพทย์')
      + '<div class="highlight">⚠️ ถ้า HR &gt; 150 สม่ำเสมอมาก หา P ไม่เจอ → อาจไม่ใช่ sinus (เช่น SVT) แจ้งแพทย์ทันที<br>🚨 ถ้ามีอาการ unstable (ความดันต่ำ ซึม เจ็บหน้าอก) → ตามทีมทันที</div>' },
  { type: 'quiz', svg: 'rate_cmp', strip: { opts: { n: 32 }, q: 'rateQ', a: 'rate' }, question: 'กราฟจริงด้านล่าง R–R ห่างกันมากกว่า 6 ช่องใหญ่ สม่ำเสมอ P ปกติทุกตัว คือจังหวะอะไร?', choices: [
    { t: 'Sinus tachycardia', ok: false, fb: 'R–R ยิ่งห่าง HR ยิ่งช้า ไม่ใช่เร็ว' },
    { t: 'Sinus bradycardia (HR ≈ 47)', ok: true, fb: '1500 ÷ 32 ช่องเล็ก ≈ 47 ครั้ง/นาที < 60 และเป็น sinus → Sinus bradycardia' },
    { t: 'Normal sinus rhythm', ok: false, fb: 'NSR ต้องมี HR 60–100' }] },
  { type: 'quiz', svg: 'tachy_action', strip: { opts: { n: 11, pr: 0.12 }, q: 'rateQ', a: 'rate' }, question: 'ผู้ป่วยไข้ 39°C กราฟเป็น sinus tachycardia HR ≈ 136 ควรทำอะไรก่อน?', choices: [
    { t: 'ลดไข้ ประเมินภาวะขาดน้ำ แล้วรายงานแพทย์', ok: true, fb: 'sinus tachycardia แก้ที่สาเหตุ ไข้ลด HR จะลดตาม' },
    { t: 'เตรียมช็อกไฟฟ้า (cardioversion)', ok: false, fb: 'sinus tachycardia ไม่รักษาด้วยการช็อกไฟฟ้า' },
    { t: 'ไม่ต้องทำอะไร เพราะเป็น sinus', ok: false, fb: 'เป็น sinus จริง แต่ร่างกายกำลังบอกว่ามีปัญหา ต้องหาสาเหตุ' }] },
  { type: 'quiz', svg: 'brady_action', strip: { opts: { n: 36 }, q: 'rateQ', a: 'rate' }, question: 'ผู้ป่วย HR ≈ 42 (กราฟด้านล่าง) บ่นหน้ามืด BP 78/40 ควรทำอย่างไร?', choices: [
    { t: 'ให้นอนพักแล้ววัดใหม่อีก 1 ชั่วโมง', ok: false, fb: 'มีอาการ + ความดันต่ำ = unstable ไม่ควรรอ' },
    { t: 'ตามทีม/แพทย์ทันที ต่อ monitor เปิดเส้น เตรียมยาตามแนวทาง', ok: true, fb: 'bradycardia ที่มีอาการ (unstable) ต้องรักษาทันทีตามแนวทาง ACLS' },
    { t: 'ให้ดื่มน้ำหวานแล้วสังเกตอาการ', ok: false, fb: 'ไม่ได้แก้ปัญหาหัวใจเต้นช้าและความดันต่ำ' }] },
  { type: 'practice', n: 10, title: 'แบบทดสอบอ่านกราฟเต็ม (10 กราฟ)', kinds: ['nsr', 'brady', 'tachy'] }
]},
{ id: 'test1', title: 'บททดสอบ: Normal Sinus Rhythm · Sinus Bradycardia · Sinus Tachycardia', desc: 'แยกจังหวะ และบอกว่า P, PR, QRS ผิดปกติหรือไม่', pages: [
  { type: 'content', title: 'วิธีสอบ',
    body: '<p>ข้อสอบมี <strong>20 กราฟ</strong> แต่ละกราฟอ่านครบ 5 ขั้น (จังหวะ+HR → P → QRS → PR → สรุป)</p>'
      + HL('🎯 กราฟที่นับว่า "อ่านถูก" ต้องตอบถูกครบทั้ง 5 ขั้น · ผ่านเมื่ออ่านถูก <strong>16 กราฟขึ้นไป (80%)</strong> · ทำค้างไว้กลับมาทำต่อได้ · ผ่านแล้วเซ็นชื่อยืนยัน')
      + K('ทบทวนเกณฑ์ปกติ<br>📌 HR 60–100 · &lt; 60 = brady · &gt; 100 = tachy<br>📌 P กว้าง &lt; 0.12 วินาที สูง &lt; 2.5 มม. (2.5 ช่องเล็ก) ตั้งขึ้นนำหน้า QRS ทุกตัว<br>📌 PR 0.12–0.20 วินาที · QRS &lt; 0.12 วินาที')
      + '<p>กราฟในข้อสอบอาจเป็น sinus ที่มีความผิดปกติร่วม 1–2 อย่าง เช่น <em>Sinus bradycardia + PR ยาว</em> ต้องบอกให้ครบ</p>' },
  { type: 'content', title: 'P wave ผิดปกติที่ต้องรู้เพิ่ม', svg: 'p_abn',
    body: K('📌 <strong>P สูงแหลม</strong> &gt; 2.5 มม. (P pulmonale) → นึกถึงห้องบนขวาโต เช่น โรคปอดเรื้อรัง<br>📌 <strong>P กว้าง</strong> &gt; 0.12 วินาที มักหยัก 2 ยอด (P mitrale) → นึกถึงห้องบนซ้ายโต เช่น โรคลิ้นหัวใจไมทรัล')
      + '<p>ทั้งสองแบบยังเป็น sinus (P ตั้งขึ้นนำหน้า QRS ทุกตัว) แต่ต้องรายงานว่า P ผิดปกติ</p>' },
  { type: 'content', title: 'P สูงแหลม บนกราฟจริง', strip: 'pwave', stripOpts: { n: 20, pAmp: 0.3 },
    body: '<p>P สูง 3 ช่องเล็ก (3 มม.) เกิน 2.5 มม. (2.5 ช่องเล็ก) → <strong>P สูงแหลม</strong> ส่วน HR 75 PR QRS ปกติ</p>' },
  { type: 'content', title: 'P กว้าง บนกราฟจริง', strip: 'pwave', stripOpts: { n: 30, pShape: 'wide' },
    body: '<p>P กว้าง 3.5 ช่องเล็ก (0.14 วินาที) มี 2 ยอด → <strong>P กว้าง</strong> และ HR 50 → <em>Sinus bradycardia + P กว้าง</em></p>' },
  { type: 'practice', n: 20, exam: true, title: 'ข้อสอบเปรียบเทียบ (20 กราฟ)' }
]},
{ id: 'twave', title: 'T wave', desc: 'T ปกติ · สูงแหลม · กลับหัว · แบน', pages: [
  { type: 'content', title: 'T wave คืออะไร', svg: 't_cmp',
    body: '<p>T wave คือช่วงที่หัวใจห้องล่าง <strong>คืนประจุ (repolarization)</strong> เตรียมบีบตัวครั้งถัดไป อยู่หลัง QRS เสมอ</p>'
      + K('📌 ปกติใน lead II: <strong>โค้งมน หัวขึ้น</strong> ทิศเดียวกับ QRS<br>📌 สูงไม่เกินราว 5 มม. (5 ช่องเล็ก) ขาขึ้นช้ากว่าขาลงเล็กน้อย')
      + HL('ดู T ทุกครั้ง 3 เรื่อง: <strong>ทิศทาง</strong> (ขึ้น/ลง) · <strong>ความสูง</strong> (สูงแหลม/แบน) · <strong>รูปร่าง</strong> (มนหรือแหลม)') },
  { type: 'content', title: 'T ปกติ บนกราฟจริง', strip: 'twave', stripOpts: { n: 20 },
    body: '<p>แถบสีเขียวคือ T ทุกตัว โค้งมน หัวขึ้น สูงราว 3 มม. (3 ช่องเล็ก)</p>' },
  { type: 'content', title: 'T สูงแหลม — โพแทสเซียมสูง', strip: 'twave', stripOpts: { n: 22, tShape: 'peaked' },
    body: K('📌 ยอด <strong>แหลม ฐานแคบ</strong> สูงเด่นจนเกือบเท่า R<br>📌 นึกถึง <strong>โพแทสเซียมในเลือดสูง (hyperkalemia)</strong> เช่น ไตวาย ยาบางชนิด (ACEI, spironolactone)')
      + '<div class="highlight">🚨 อาจรุนแรงจนหัวใจหยุดเต้นได้ → <strong>แจ้งแพทย์ทันที</strong> ต่อ monitor เตรียมตรวจเกลือแร่</div>' },
  { type: 'content', title: 'T กลับหัว — กล้ามเนื้อหัวใจขาดเลือด', strip: 'twave', stripOpts: { n: 21, tShape: 'inverted' },
    body: K('📌 T อยู่ <strong>ใต้เส้นฐาน</strong> ในลีดที่ควรหัวขึ้น (lead II)<br>📌 นึกถึง <strong>กล้ามเนื้อหัวใจขาดเลือด</strong> หรือภาวะอื่น เช่น หัวใจห้องล่างหนา')
      + HL('⚠️ ผู้ป่วยมีเจ็บแน่นหน้าอกร่วม → แจ้งแพทย์ทันที · ควรทำ EKG 12 lead เทียบกับของเดิม')
      + '<p style="font-size:.78rem;color:#8A7A80">กราฟในบทเรียนเป็น lead II เส้นเดียว การบอกตำแหน่งที่ขาดเลือดต้องใช้ EKG 12 lead</p>' },
  { type: 'quiz', svg: 't_cmp', strip: { opts: { n: 22, tShape: 'peaked' }, q: 'twaveQ', a: 'twave' }, question: 'ผู้ป่วยไตวาย T wave ในกราฟจริงด้านล่างเป็นแบบนี้ นึกถึงอะไร?', choices: [
    { t: 'โพแทสเซียมต่ำ', ok: false, fb: 'K ต่ำ T จะแบน และมี U wave เด่น' },
    { t: 'โพแทสเซียมสูง — แจ้งแพทย์ทันที', ok: true, fb: 'T สูงแหลมฐานแคบ + ไตวาย → hyperkalemia อันตราย' },
    { t: 'ปกติ ไม่ต้องทำอะไร', ok: false, fb: 'T สูงแหลมไม่ใช่ลักษณะปกติ' }] },
  { type: 'drill', ex: 9, n: 5, title: 'แบบทดสอบท้ายบท: แยกรูปแบบ T wave', hint: 'ดูทิศทาง ความสูง และรูปร่างของ T ในแถบที่ไฮไลต์' }
]},
{ id: 'qt', title: 'QT interval', desc: 'วัด QT · กฎครึ่ง R–R · QT ยาว', pages: [
  { type: 'content', title: 'QT คืออะไร วัดอย่างไร', svg: 'qt_measure',
    body: '<p>QT คือเวลาตั้งแต่หัวใจห้องล่าง <strong>เริ่มบีบ</strong> จนถึง <strong>คืนประจุเสร็จ</strong> วัดจาก <strong>ต้น QRS ถึงจบ T</strong></p>'
      + K('📌 ค่า QT เปลี่ยนตาม HR (HR เร็ว QT สั้นลง)<br>📌 <strong>กฎจำง่าย</strong> (ใช้เมื่อ HR 60–100): จบ T ต้อง <strong>ไม่เกินครึ่งทาง</strong> ระหว่าง R สองตัว<br>📌 ค่าที่แม่นกว่าคือ QTc (ปรับตาม HR) มักรายงานโดยเครื่อง: QTc &gt; 0.50 วินาที = อันตราย') },
  { type: 'content', title: 'QT ปกติ บนกราฟจริง', strip: 'qt', stripOpts: { n: 22, qt: 0.40 },
    body: '<p>QT = 10 ช่องเล็ก = <strong>0.40 วินาที</strong> · R–R = 0.88 วินาที ครึ่งหนึ่ง = 0.44 → จบ T ก่อนครึ่งทาง = <strong>ปกติ</strong></p>' },
  { type: 'content', title: 'QT ยาว บนกราฟจริง', strip: 'qt', stripOpts: { n: 22, qt: 0.56 },
    body: '<p>QT = 14 ช่องเล็ก = <strong>0.56 วินาที</strong> เกินครึ่ง R–R (0.44) → <strong>QT ยาว</strong></p>'
      + K('📌 สาเหตุ: <strong>ยา</strong> (เช่น ยาปฏิชีวนะกลุ่ม macrolide/quinolone, ยาต้านอาการทางจิต, ondansetron, amiodarone) · <strong>เกลือแร่ต่ำ</strong> (K, Mg, Ca) · โรคทางพันธุกรรม')
      + '<div class="highlight">⚠️ เสี่ยงหัวใจเต้นผิดจังหวะชนิดอันตราย <strong>Torsades de pointes</strong> → ทบทวนยาที่ได้รับ รายงานแพทย์ ถ้าหน้ามืด/หมดสติ ตามทีมทันที</div>' },
  { type: 'quiz', svg: 'qt_measure', strip: { opts: { n: 22, qt: 0.56 }, q: 'qtQ', a: 'qt' }, question: 'กราฟด้านล่าง จบ T เลยครึ่งทางระหว่าง R สองตัว หมายความว่าอย่างไร?', choices: [
    { t: 'QT ปกติ', ok: false, fb: 'ถ้าจบ T เลยครึ่ง R–R ถือว่ายาว' },
    { t: 'QT ยาว — ทบทวนยาและเกลือแร่ รายงานแพทย์', ok: true, fb: 'QT ยาวเสี่ยง Torsades de pointes' },
    { t: 'PR ยาว', ok: false, fb: 'PR วัดจากต้น P ถึงต้น QRS คนละช่วงกับ QT' }] },
  { type: 'drill', ex: 10, n: 5, title: 'แบบทดสอบท้ายบท: วัด QT', hint: 'วัดจากต้น QRS ถึงจบ T แล้วเทียบกับครึ่ง R–R' }
]},
{ id: 'uwave', title: 'U wave', desc: 'U ปกติ · U เด่นในโพแทสเซียมต่ำ', pages: [
  { type: 'content', title: 'U wave คืออะไร', svg: 'u_wave',
    body: '<p>U wave คือคลื่นเล็ก ๆ ที่อาจเห็น <strong>ตามหลัง T</strong> ทิศเดียวกับ T</p>'
      + K('📌 <strong>ส่วนใหญ่มองไม่เห็น</strong> หรือเห็นเล็กมาก (&lt; 1 มม.) → ปกติ พบบ่อยเมื่อ HR ช้า<br>📌 <strong>U เด่น สูงกว่า T</strong> ที่แบนลง → นึกถึง <strong>โพแทสเซียมต่ำ (hypokalemia)</strong>')
      + HL('⚠️ K ต่ำ: ท้องเสีย อาเจียน ยาขับปัสสาวะ → เสี่ยงหัวใจเต้นผิดจังหวะ รายงานแพทย์ ตรวจเกลือแร่') },
  { type: 'content', title: 'U เล็ก (ปกติ) บนกราฟจริง', strip: 'uwave', stripOpts: { n: 27, uAmp: 0.05 },
    body: '<p>วงสีส้มคือ U เล็ก ๆ หลัง T ปกติ สูงไม่ถึง 1 มม. (1 ช่องเล็ก) → <strong>พบได้ในคนปกติ</strong></p>' },
  { type: 'content', title: 'T แบน + U เด่น — โพแทสเซียมต่ำ', strip: 'uwave', stripOpts: { n: 27, tShape: 'flat', uAmp: 0.2 },
    body: '<p>T เตี้ยแบน แต่ U สูงเด่นกว่า T → รูปแบบของ <strong>โพแทสเซียมต่ำ</strong></p>'
      + '<p style="font-size:.78rem;color:#8A7A80">T กับ U ที่ติดกันอาจทำให้วัด QT ยาวเกินจริง ให้วัด QT ถึงจบ T ไม่รวม U</p>' },
  { type: 'quiz', svg: 'u_wave', strip: { opts: { n: 27, tShape: 'flat', uAmp: 0.2 }, q: 'uQ', a: 'uwave' }, question: 'ผู้ป่วยท้องเสียหลายวัน กราฟด้านล่างมี T แบน และคลื่นเด่นตามหลัง นึกถึงอะไร?', choices: [
    { t: 'โพแทสเซียมต่ำ — รายงานแพทย์ ตรวจเกลือแร่', ok: true, fb: 'T แบน + U เด่น + เสียโพแทสเซียมทางอุจจาระ → hypokalemia' },
    { t: 'โพแทสเซียมสูง', ok: false, fb: 'K สูง T จะสูงแหลม ไม่แบน' },
    { t: 'เป็น P wave ของบีตถัดไป', ok: false, fb: 'P จะอยู่ชิดหน้า QRS ส่วนคลื่นนี้อยู่ติดหลัง T' }] },
  { type: 'drill', ex: 11, n: 5, title: 'แบบทดสอบท้ายบท: ดู U wave', hint: 'ดูช่วงหลัง T ว่ามีคลื่นเพิ่มหรือไม่ และสูงเด่นแค่ไหน' }
]},
{ id: 'test2', title: 'บททดสอบ: T wave · QT interval · U wave', desc: 'อ่าน T, QT, U และบอกว่าต้องทำอะไร', pages: [
  { type: 'content', title: 'วิธีสอบ', svg: 't_cmp',
    body: '<p>ข้อสอบมี <strong>10 กราฟ</strong> แต่ละกราฟอ่าน 5 ขั้น: <strong>จังหวะ+HR → T wave → QT → U wave → สรุป</strong></p>'
      + HL('🎯 กราฟที่นับว่า "อ่านถูก" ต้องถูกครบทั้ง 5 ขั้น · ผ่านเมื่ออ่านถูก <strong>8 กราฟขึ้นไป (80%)</strong>')
      + K('ทบทวน<br>📌 T สูงแหลม → K สูง 🚨 · T กลับหัว → ขาดเลือด · T แบน + U เด่น → K ต่ำ<br>📌 QT: ต้น QRS → จบ T · จบ T เลยครึ่ง R–R = QT ยาว') },
  { type: 'practice', n: 10, gen: 'tqu', title: 'ข้อสอบรวม T · QT · U (10 กราฟ)' }
]},
{ id: 'full', title: 'อ่านกราฟครบทุกขั้น (รวมทุกเรื่อง)', desc: 'จังหวะ · HR · P · PR · QRS · T · QT · U → สรุปและสิ่งที่ต้องทำ', pages: [
  { type: 'content', title: 'อ่าน EKG อย่างเป็นระบบ 8 ขั้น', svg: 'full_steps',
    body: '<p>บทนี้รวมทุกเรื่องที่เรียนมา อ่านกราฟ <strong>ทีละขั้นตามลำดับเดิมทุกครั้ง</strong> จะไม่พลาดความผิดปกติ</p>'
      + '<ol class="steps8"><li><strong>จังหวะ + HR</strong> — R–R สม่ำเสมอไหม · HR เท่าไร (1500 ÷ ช่องเล็ก / 300 ÷ ช่องใหญ่ / 6 วินาที × 10)</li>'
      + '<li><strong>P wave</strong> — มีไหม ตั้งขึ้นไหม นำหน้า QRS ทุกตัวไหม สูง/กว้างเกินไหม</li>'
      + '<li><strong>PR interval</strong> — ต้น P → ต้น QRS (0.12–0.20 วินาที = 3–5 ช่องเล็ก)</li>'
      + '<li><strong>QRS</strong> — กว้างเท่าไร (&lt; 0.12 วินาที = น้อยกว่า 3 ช่องเล็ก)</li>'
      + '<li><strong>T wave</strong> — ทิศทาง · ความสูง · รูปร่าง</li>'
      + '<li><strong>QT</strong> — ต้น QRS → จบ T ไม่เกินครึ่ง R–R</li>'
      + '<li><strong>U wave</strong> — มีไหม เด่นกว่า T ไหม</li>'
      + '<li><strong>สรุป</strong> — ชื่อจังหวะ + ความผิดปกติที่พบ + สิ่งที่ต้องทำ</li></ol>'
      + HL('🎯 เคล็ดลับ: ขั้น 1–2 บอก <strong>ชื่อจังหวะ</strong> · ขั้น 3–7 บอก <strong>ความผิดปกติเพิ่มเติม</strong> ที่ต้องต่อท้ายชื่อ') },
  { type: 'content', title: 'ค่าปกติที่ต้องจำ (สรุปทุกบท)', strip: 'allA', stripOpts: { n: 20, qt: 0.36 },
    body: '<table class="norm-t"><tr><th>ขั้น</th><th>ค่าปกติ</th><th>ผิดปกติที่เรียนมา</th></tr>'
      + '<tr><td>จังหวะ + HR</td><td>R–R เท่ากัน · 60–100</td><td>&lt; 60 brady · &gt; 100 tachy · R–R ไม่เท่า = sinus arrhythmia</td></tr>'
      + '<tr><td>P</td><td>ตั้งขึ้น นำหน้า QRS ทุกตัว · สูง ≤ 2.5 มม. (2.5 ช่องเล็ก) · กว้าง ≤ 0.12 วินาที (3 ช่องเล็ก)</td><td>สูงแหลม · กว้าง · กลับหัว/ไม่มี (junctional)</td></tr>'
      + '<tr><td>PR</td><td>0.12–0.20 วินาที (3–5 ช่องเล็ก)</td><td>&gt; 0.20 ยาว · &lt; 0.12 สั้น</td></tr>'
      + '<tr><td>QRS</td><td>&lt; 0.12 วินาที (น้อยกว่า 3 ช่องเล็ก)</td><td>≥ 0.12 กว้าง</td></tr>'
      + '<tr><td>T</td><td>หัวขึ้น โค้งมน สูง ≤ 5 มม. (5 ช่องเล็ก)</td><td>สูงแหลม (K สูง) · กลับหัว (ขาดเลือด) · แบน (K ต่ำ)</td></tr>'
      + '<tr><td>QT</td><td>ไม่เกินครึ่ง R–R</td><td>เกินครึ่ง = QT ยาว</td></tr>'
      + '<tr><td>U</td><td>ไม่มี หรือเล็ก &lt; 1 มม. (1 ช่องเล็ก)</td><td>U เด่นกว่า T (K ต่ำ)</td></tr></table>'
      + '<p style="font-size:.8rem">กราฟจริงด้านล่าง: ทุกขั้นปกติ → <strong>Normal sinus rhythm</strong></p>' },
  { type: 'content', title: 'ตัวอย่างวิเคราะห์ 1', strip: 'allA', stripOpts: { kind: 'brady', n: 32, pr: 0.28, qt: 0.44, tShape: 'inverted' },
    body: '<ol class="steps8"><li>R–R เท่ากัน 32 ช่องเล็ก → สม่ำเสมอ · 1500 ÷ 32 ≈ <strong>47</strong> → ช้า</li>'
      + '<li>P ตั้งขึ้น นำหน้า QRS ทุกตัว → sinus</li>'
      + '<li>PR = 7 ช่องเล็ก = <strong>0.28 วินาที</strong> → ยาว</li>'
      + '<li>QRS = 2 ช่องเล็ก = 0.08 วินาที → แคบ ปกติ</li>'
      + '<li>T <strong>อยู่ใต้เส้นฐาน</strong> → กลับหัว</li>'
      + '<li>QT = 11 ช่องเล็ก = 0.44 วินาที · ครึ่ง R–R = 0.64 → ปกติ</li>'
      + '<li>ไม่มี U</li></ol>'
      + HL('<strong>สรุป:</strong> Sinus bradycardia + PR ยาว (1st degree AV block) + T กลับหัว<br>👉 ประเมินอาการหน้ามืด/เจ็บหน้าอก ทบทวนยาที่ทำให้หัวใจช้า ทำ EKG 12 lead รายงานแพทย์') },
  { type: 'content', title: 'ตัวอย่างวิเคราะห์ 2', strip: 'allA', stripOpts: { n: 24, qt: 0.36, pAmp: 0.3, tShape: 'flat', uAmp: 0.2 },
    body: '<ol class="steps8"><li>R–R เท่ากัน 24 ช่องเล็ก → สม่ำเสมอ · 1500 ÷ 24 ≈ <strong>63</strong> → ปกติ</li>'
      + '<li>P สูง 3 มม. (3 ช่องเล็ก) เกิน 2.5 มม. → <strong>P สูงแหลม</strong></li>'
      + '<li>PR = 4 ช่องเล็ก = 0.16 วินาที → ปกติ</li>'
      + '<li>QRS = 2 ช่องเล็ก = 0.08 วินาที → ปกติ</li>'
      + '<li>T เตี้ยไม่ถึง 1 มม. (1 ช่องเล็ก) → <strong>T แบน</strong></li>'
      + '<li>QT = 9 ช่องเล็ก = 0.36 วินาที · ครึ่ง R–R = 0.48 → ปกติ (วัดถึงจบ T ไม่รวม U)</li>'
      + '<li>มีคลื่นเด่นหลัง T สูงกว่า T → <strong>U เด่น</strong></li></ol>'
      + HL('<strong>สรุป:</strong> Sinus rhythm (HR ปกติ) + P สูงแหลม + T แบน + U เด่น<br>👉 นึกถึงโพแทสเซียมต่ำ → รายงานแพทย์ ตรวจเกลือแร่ · P สูงแหลมบันทึกไว้ (ห้องบนขวาอาจโต)') },
  { type: 'content', title: 'ตัวอย่างวิเคราะห์ 3', strip: 'allA', stripOpts: { kind: 'tachy', n: 13, pr: 0.12, qrs: 0.06, qt: 0.24, tShape: 'peaked' },
    body: '<ol class="steps8"><li>R–R เท่ากัน 13 ช่องเล็ก → สม่ำเสมอ · 1500 ÷ 13 ≈ <strong>115</strong> → เร็ว</li>'
      + '<li>P ตั้งขึ้น นำหน้า QRS ทุกตัว → sinus</li>'
      + '<li>PR = 3 ช่องเล็ก = 0.12 วินาที → ปกติ (ขอบล่าง)</li>'
      + '<li>QRS = 1.5 ช่องเล็ก = 0.06 วินาที → แคบ</li>'
      + '<li>T สูงเกือบเท่า R ยอดแหลม ฐานแคบ → <strong>T สูงแหลม</strong></li>'
      + '<li>QT = 6 ช่องเล็ก = 0.24 วินาที · ครึ่ง R–R = 0.26 → ปกติ (HR เร็ว QT สั้นลงตาม)</li>'
      + '<li>ไม่มี U</li></ol>'
      + '<div class="highlight">🚨 <strong>สรุป:</strong> Sinus tachycardia + T สูงแหลม<br>👉 นึกถึงโพแทสเซียมสูง → <strong>แจ้งแพทย์ทันที</strong> ต่อ monitor เตรียมตรวจเกลือแร่</div>' },
  { type: 'content', title: 'เจอหลายอย่างพร้อมกัน รายงานอะไรก่อน', svg: 't_cmp', strip: 'qt', stripOpts: { n: 22, qt: 0.56 },
    body: '<p>เมื่อพบความผิดปกติหลายอย่าง ให้ <strong>บอกครบทุกข้อ</strong> แต่จัดลำดับความเร่งด่วน</p>'
      + '<div class="highlight">🚨 <strong>แจ้งทันที</strong>: T สูงแหลม (K สูง) · ผู้ป่วยมีอาการ (เจ็บหน้าอก หน้ามืด ความดันต่ำ) ร่วมกับกราฟผิดปกติ</div>'
      + K('⚠️ <strong>รายงานแพทย์</strong>: QT ยาว (กราฟด้านล่าง) · T แบน + U เด่น (K ต่ำ) · T กลับหัว · QRS กว้าง · PR สั้น · จังหวะไม่ใช่ sinus')
      + '<p>📝 <strong>บันทึก / เฝ้าระวัง</strong>: PR ยาว · P สูงแหลม/กว้าง · sinus brady/tachy ที่ไม่มีอาการ (หาสาเหตุร่วมด้วย)</p>'

function el(id) { return document.getElementById(id); }
const $ = el;
const monitor = el('monitor'), park = el('park');
const lessonS = makeStrip({ n: 20, pr: 0.16, qrs: 0.08 });
function useStrip(ns, info) { S = ns; buildPts(); play(); el('stripInfo').textContent = info; }
const PASS = 0.8, PER_STRIP = 5;
const STEPS = pg => (pg && pg.steps) || PER_STRIP;   // จำนวนขั้นต่อกราฟ
// บทฝึก: ข้อสรุปต้องถูก และผิดได้ไม่เกิน 1 ขั้น (บท 8 ขั้น ผิดได้ 2) · บททดสอบเปรียบเทียบ: ต้องถูกครบทุกขั้น
const wrongAllowed = pg => (pg && pg.exam) ? 0 : (STEPS(pg) >= 8 ? 2 : 1);

/* ---- กระดาษคำตอบ: เก็บรูปกราฟ + สรุปคำตอบทีละข้อ ระหว่างทำแบบทดสอบรอบปัจจุบัน ---- */
let paperBuf = { items: [], images: [] }, paperPending = 0;
function captureGraphImage() {
  try {
    const maxW = 640, scale = Math.min(1, maxW / cv.width);
    const off = document.createElement('canvas');
    off.width = Math.round(cv.width * scale); off.height = Math.round(cv.height * scale);
    off.getContext('2d').drawImage(cv, 0, 0, off.width, off.height);
    return off.toDataURL('image/jpeg', 0.6);
  } catch (e) { return ''; }
}
function pushPaperItem(item) {
  const idx = paperBuf.items.length;
  paperBuf.items.push(item); paperBuf.images.push('');
  paperPending++;
  // รอให้ภาพเฉลย (overlay) วาดจบก่อนค่อยแคป (แอนิเมชันเฉลยยาว ~1.7 วินาที)
  // แต่ถ้าตอบเร็วมาก (กราฟยังวาดเส้นไม่จบ — sweep-in ของกราฟใหม่ยาว ~3 วินาที เริ่มนับใหม่ทุกครั้งที่ขึ้นกราฟใหม่)
  // ต้องรอให้เส้นวาดจบ (sweeping === false) ก่อน ไม่งั้นจะได้ภาพกราฟที่ขาดครึ่งเดียว (มีจุดเขียวค้างกลางกราฟ)
  const start = performance.now();
  const tryCapture = () => {
    const doneEnough = !sweeping && (performance.now() - start) >= 1750;
    if (doneEnough || performance.now() - start >= 4500) {   // กันรอค้างไม่จบในเคสผิดปกติ
      paperBuf.images[idx] = captureGraphImage(); paperPending--;
    } else {
      setTimeout(tryCapture, 150);
    }
  };
  setTimeout(tryCapture, 1750);
}
function whenPaperReady(cb, tries) {
  tries = tries || 0;
  if (paperPending <= 0 || tries > 12) return cb();
  setTimeout(() => whenPaperReady(cb, tries + 1), 300);
}

/* ================= พิมพ์บทเรียน: เฉพาะเนื้อหาที่สอนกราฟ + ข้อสอบเปล่า (ไม่มีเฉลย) ================= */
function prEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function captureStripImage() {
  try {
    const maxW = 900, scale = Math.min(1, maxW / cv.width);
    const off = document.createElement('canvas');
    off.width = Math.round(cv.width * scale); off.height = Math.round(cv.height * scale);
    off.getContext('2d').drawImage(cv, 0, 0, off.width, off.height);
    return off.toDataURL('image/jpeg', 0.75);
  } catch (e) { return ''; }
}
// รอให้เส้นกราฟวาดจบ (sweep-in ~3 วิ) ก่อนเสมอ · withOverlay=true คือรอให้ภาพเฉลย/คำอธิบายวาดจบด้วย (~1.7 วิ)
async function waitGraphReady(withOverlay) {
  const t0 = performance.now();
  while (sweeping && performance.now() - t0 < 5000) await sleep(120);
  await sleep(withOverlay ? 1750 : 150);
}
function prSetProgress(txt) { const n = el('prLoadingN'); if (n) n.textContent = txt; }

// สร้าง HTML สำหรับพิมพ์ของบทเรียนที่ระบุ: เนื้อหาสอน (content/quiz ทุกหน้า) + ข้อสอบเปล่าไม่มีเฉลย (สุ่มชุดใหม่)
async function buildLessonPrintDoc(les) {
  let html = `<div class="pr-title">${prEsc(les.title)}</div>`;
  const pages = les.pages.filter(p => p.type === 'content' || p.type === 'quiz');
  for (let i = 0; i < pages.length; i++) {
    const pg = pages[i];
    prSetProgress(`กำลังเตรียมเนื้อหา ${i + 1}/${pages.length}`);
    if (pg.type === 'content') {
      let block = `<section class="pr-block"><h3>${prEsc(pg.title || '')}</h3><div class="pr-body">${pg.body || ''}</div>`;
      if (pg.svg) block += `<div class="pr-svg">${genSVG(pg.svg)}</div>`;
      if (pg.strip) {
        useStrip(pg.stripOpts ? makeStrip(pg.stripOpts) : lessonS, '');
        setOverlay(pg.strip);
        await waitGraphReady(true);
        block += `<img class="pr-strip" src="${captureStripImage()}">`;
      }
      html += block + '</section>';
    } else {
      let block = `<section class="pr-block"><div class="pr-qtext">${prEsc(pg.question || '')}</div><ul class="pr-choices">` +
        pg.choices.map(c => `<li${c.ok ? ' class="pr-right"' : ''}>${c.ok ? '✔ ' : ''}${prEsc(c.t)}</li>`).join('') + '</ul>';
      if (pg.svg) block += `<div class="pr-svg">${genSVG(pg.svg)}</div>`;
      if (pg.strip) {
        useStrip(makeStrip(pg.strip.opts), '');
        setOverlay(pg.strip.a || pg.strip.q);
        await waitGraphReady(true);
        block += `<img class="pr-strip" src="${captureStripImage()}">`;
      }
      html += block + '</section>';
    }
  }

  const ti = testPageIdx(les), tpg = les.pages[ti];
  if (tpg) {
    html += `<div class="pr-title">แบบฝึกหัดท้ายบท (${tpg.n} ${unitName(tpg)} — ไม่มีเฉลย สำหรับฝึกทำมือ)</div>`;
    seedRNG(newSeed());
    for (let g = 0; g < tpg.n; g++) {
      prSetProgress(`กำลังสร้างข้อสอบกราฟที่ ${g + 1}/${tpg.n}`);
      if (tpg.type === 'drill') {
        const D = EX[tpg.ex]();
        useStrip(D.S, ''); setOverlay('none');
        await waitGraphReady(false);
        html += `<section class="pr-exam-item"><div class="pr-exam-no">ข้อ ${g + 1}/${tpg.n}</div>
          <img class="pr-strip" src="${captureStripImage()}">
          <div class="pr-qtext">${prEsc(D.q)}</div>
          <ul class="pr-blank-choices">${D.opts.map(o => `<li><span class="pr-box"></span>${prEsc(o[0])}</li>`).join('')}</ul></section>`;
      } else {
        const Sx = tpg.exam ? genExamStrip() : tpg.gen === 'tqu' ? genTquStrip() : tpg.gen === 'all' ? genAllStrip() : genStrip(tpg.kinds);
        const Qs = tpg.exam ? buildExamQs(Sx) : tpg.gen === 'tqu' ? buildTquQs(Sx) : tpg.gen === 'all' ? buildAllQs(Sx) : buildQs(Sx, tpg.kinds);
        useStrip(Sx, ''); setOverlay('none');
        await waitGraphReady(false);
        html += `<section class="pr-exam-item"><div class="pr-exam-no">กราฟที่ ${g + 1}/${tpg.n}</div>
          <img class="pr-strip" src="${captureStripImage()}">` +
          Qs.map(Q => `<div class="pr-qtext">${prEsc(Q.tag)}: ${prEsc(Q.q)}</div>
            <ul class="pr-blank-choices">${Q.opts.map(o => `<li><span class="pr-box"></span>${prEsc(o[0])}</li>`).join('')}</ul>`).join('') +
          `</section>`;
      }
    }
  }
  return html;
}

async function runPrintJob(list) {
  parkMonitor();
  show('lesson');
  el('v-lesson').innerHTML = `<div class="lesson-header"><h2>🖨️ กำลังเตรียมเอกสารพิมพ์ EKG</h2>
      <div class="lh-sub" id="prAllMsg">กำลังเริ่มต้น… (มีหลายบท อาจใช้เวลาหลายนาที กรุณาอย่าปิดแท็บนี้)</div></div>
    <div id="monSlot"></div>`;
  const slot = el('monSlot');
  if (slot) slot.replaceWith(monitor);   // ต้องย้าย monitor เข้ามาในหน้าที่มองเห็นได้ ไม่งั้นกราฟจะไม่มีขนาด แคปภาพไม่ได้
  let all = '';

    all += await buildLessonPrintDoc(les);
  }
  const area = el('printArea');
  if (area) area.innerHTML = all;
  parkMonitor();
  el('v-lesson').innerHTML = `<div class="content-card done-card"><h3>✅ เอกสารพร้อมพิมพ์แล้ว</h3>
    <p>รวมเนื้อหาสอน + แบบฝึกหัดท้ายบท (ไม่มีเฉลย) ที่เลือกไว้ ${list.length} บท</p>
    <button class="next-btn" onclick="window.print()">🖨️ พิมพ์เอกสาร</button>
    <button class="ghost-btn wide" onclick="renderMenu()">กลับเมนูบทเรียน</button></div>`;
}
async function printLesson() {
  const les = curLes();
  const btn = el('printBtn'), loading = el('prLoading');
  if (btn) btn.disabled = true;
  if (loading) loading.hidden = false;
  try {
    const html = await buildLessonPrintDoc(les);
    const area = el('printArea');
    if (area) area.innerHTML = html;
    renderPage();   // คืนค่าหน้าจอปกติ (กราฟที่ถูกเขียนทับไปมาระหว่างเตรียมเอกสาร) ก่อนสั่งพิมพ์
    await sleep(80);
    if (loading) loading.hidden = true;   // ปิดก่อนเปิดกล่องพิมพ์ (window.print() บางเบราว์เซอร์หยุดสคริปต์รอจนกว่าจะปิดกล่อง)
    window.print();
  } catch (e) {
    toast('เตรียมเอกสารพิมพ์ไม่สำเร็จ: ' + (e && e.message || e));
  } finally {
    if (loading) loading.hidden = true;
    if (btn) btn.disabled = false;
  }
}

/* ================= เก็บความคืบหน้า (เครื่อง + Google Sheet) ================= */
const gs = () => (window.google && google.script && google.script.run) ? google.script.run : null;
const SIGN = () => !!gs();   // เซ็นชื่อเฉพาะเมื่อเปิดผ่านระบบ Learning OPD
let saved = { v: 2, done: {}, test: {}, page: {}, updatedAt: 0 };
try { const v = JSON.parse(localStorage.getItem('ekgApp2') || 'null'); if (v) Object.assign(saved, v); } catch (e) {}
let cloudT = 0;
function persist() {
  saved.updatedAt = Date.now();
  try { localStorage.setItem('ekgApp2', JSON.stringify(saved)); } catch (e) {}
  const r = gs(); if (!r) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(() => { try { gs().withFailureHandler(() => {}).saveEkgState(JSON.stringify(saved)); } catch (e) {} }, 1200);
}
function loadCloud(cb) {
  const r = gs(); if (!r) return cb();
  let doneCb = false; const go = () => { if (!doneCb) { doneCb = true; cb(); } };
  setTimeout(go, 6000);
  r.withSuccessHandler(txt => {
    try {
      const v = JSON.parse(txt || 'null');
      if (v && v.v === 2 && (v.updatedAt || 0) > (saved.updatedAt || 0)) {
        saved = Object.assign({ v: 2, done: {}, test: {}, page: {}, updatedAt: 0 }, v);
        try { localStorage.setItem('ekgApp2', JSON.stringify(saved)); } catch (e) {}
      }
    } catch (e) {}
    go();
  }).withFailureHandler(go).getEkgState();
}

let toastT = 0;
function toast(msg) { const t = el('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

/* ================= เมนูและการเปลี่ยนหน้า ================= */
const ST = { lesson: 0, page: 0 };
function show(v) { ['menu', 'lesson'].forEach(n => el('v-' + n).classList.toggle('active', n === v)); }
function parkMonitor() { park.appendChild(monitor); }
let HOME_URL = '';
try {
  google.script.run.withSuccessHandler(u => { HOME_URL = u; el('homeLink').href = u; }).withFailureHandler(() => {}).getEkgHomeUrl();
} catch (e) {}
function goBack(e) {
  // อยู่ในบทเรียน → กลับหน้ารายชื่อบท EKG
  if (el('v-lesson').classList.contains('active')) { if (e) e.preventDefault(); renderMenu(); return false; }
  // อยู่หน้ารายชื่อบท → กลับหน้าหลักของระบบ
  if (HOME_URL) return true;
  if (e) e.preventDefault();
  if (!gs()) return false;
  history.back();
  return false;
}
const curLes = () => LESSONS[ST.lesson], curPg = () => curLes().pages[ST.page];
const testPageIdx = les => les.pages.findIndex(p => p.type === 'drill' || p.type === 'practice');
const testN = les => { const p = les.pages[testPageIdx(les)]; return p ? p.n : 0; };
const isFull = pg => pg && pg.type === 'practice';
const totalItems = pg => isFull(pg) ? pg.n * STEPS(pg) : pg.n;          // จำนวนขั้นที่ต้องตอบทั้งหมด
const unitName = pg => isFull(pg) ? 'กราฟ' : 'ข้อ';
// ผลรายกราฟ: true = ถูกครบ 5 ขั้น, false = ผิดอย่างน้อย 1 ขั้น, undefined = ยังไม่ครบ
function unitResults(t, pg) {
  if (!isFull(pg)) return t.res.slice();
  const m = STEPS(pg), allow = wrongAllowed(pg), out = [];
  for (let k = 0; k * m < t.res.length; k++) {
    const ch = t.res.slice(k * m, (k + 1) * m);
    const wrong = ch.filter(x => !x).length;
    if (ch.length < m) { out.push(wrong > allow ? false : undefined); continue; }
    out.push(!!ch[m - 1] && wrong <= allow);   // ข้อสรุปต้องถูก และผิดได้ไม่เกิน allow ขั้น
  }
  return out;
}
const unitsDone = (t, pg) => isFull(pg) ? Math.floor(t.i / STEPS(pg)) : t.i;
const unitsRight = (t, pg) => unitResults(t, pg).filter(v => v === true).length;
function freshTest(prev) {
  return { base: newSeed(), i: 0, right: 0, res: [], cur: [], attempt: prev ? (prev.attempt || 1) + 1 : 1,
    passed: prev ? !!prev.passed : false, signed: prev ? !!prev.signed : false, best: prev ? prev.best || null : null };
}
function T(les) { les = les || curLes(); return saved.test[les.id] || (saved.test[les.id] = freshTest()); }

function lessonStatus(les) {
  const t = saved.test[les.id], pg = les.pages[testPageIdx(les)], n = testN(les), tot = totalItems(pg);
  if (saved.done[les.id] && t && (t.signed || !SIGN())) return { cls: 'done', txt: 'ผ่านแล้ว ✓' };
  if (saved.done[les.id]) return { cls: 'sign', txt: '✍️ รอเซ็นชื่อ' };
  if (t && t.i > 0 && t.i < tot) return { cls: 'doing', txt: `ทำต่อ ${unitName(pg)} ${Math.min(unitsDone(t, pg) + 1, n)}/${n}` };
  if (t && t.i >= tot) return { cls: 'doing', txt: 'ดูผลสอบ / สอบใหม่' };
  if (saved.page[les.id]) return { cls: 'doing', txt: `เรียนต่อ หน้า ${saved.page[les.id] + 1}` };
  return null;
}
function renderMenu() {
  parkMonitor();
  const n = LESSONS.filter(l => saved.done[l.id]).length;
  let h = `<div class="progress-bar"><div class="progress-fill" style="width:${n / LESSONS.length * 100}%"></div></div>
    <div class="menu-meta">ผ่าน ${n}/${LESSONS.length} บท · ทำค้างไว้กลับมาทำต่อได้ทุกบท</div><div class="lesson-list">`;
  LESSONS.forEach((les, i) => {
    const st = lessonStatus(les), d = saved.done[les.id];
    h += `<button class="lesson-card" onclick="startLesson(${i})"><span class="lnum ${d ? 'done' : 'todo'}">${d ? '✓' : i + 1}</span>
      <span><span class="ltitle">${les.title}</span><span class="ldesc">${les.desc} · ข้อสอบ ${testN(les)} ${unitName(les.pages[testPageIdx(les)])}</span></span>
      ${st ? `<span class="lstatus s-${st.cls}">${st.txt}</span>` : ''}</button>`;
  });
  el('v-menu').innerHTML = h + '</div>';
  show('menu'); window.scrollTo(0, 0);
}
function startLesson(i, fromStart) {
  ST.lesson = i;
  const les = curLes(), t = saved.test[les.id], ti = testPageIdx(les);
  const n = totalItems(les.pages[ti]);
  ST.page = fromStart ? 0 : (t && ((t.i > 0 && t.i < n) || (saved.done[les.id] && !t.signed && SIGN()))) ? ti : (saved.page[les.id] || 0);
  renderPage();
}

function renderPage() {
  parkMonitor();
  const les = curLes(), pg = curPg();
  saved.page[les.id] = ST.page; persist();
  let h = `<div class="top-row"><button class="back-btn" onclick="renderMenu()">‹ กลับเมนู</button>${ST.page ? `<button class="back-btn" onclick="startLesson(${ST.lesson}, true)">↺ เริ่มบทนี้ใหม่จากหน้าแรก</button>` : ''}<button class="back-btn" id="printBtn" onclick="printLesson()">🖨️ พิมพ์บทเรียนนี้</button></div>
    <div class="lesson-header"><h2>${les.title}</h2><div class="lh-sub">หน้า ${ST.page + 1}/${les.pages.length}</div></div>
    <div class="step-dots">${les.pages.map((p, i) => `<span class="sdot ${i < ST.page ? 'done' : i === ST.page ? 'now' : ''} ${p.type === 'drill' || p.type === 'practice' ? 'star' : ''}"></span>`).join('')}</div>`;
  const nav = () => `<div class="nav-row">${ST.page > 0 ? '<button class="ghost-btn" onclick="prevPage()">← ย้อน</button>' : ''}<button class="next-btn" onclick="nextPage()">ถัดไป →</button></div>`;
  if (pg.type === 'content') {
    h += `<div class="content-card"><h3>${pg.title}${pg.strip ? ' <span class="tag">กราฟจริง</span>' : ''}</h3>${pg.body}</div>`;
    if (pg.svg) h += `<div class="svg-area">${genSVG(pg.svg)}</div>`;
    if (pg.strip) h += '<div id="monSlot"></div>';
    h += nav();
  } else if (pg.type === 'quiz') {
    const order = shuffle(pg.choices.map((_, i) => i));
    if (pg.svg) h += `<div class="svg-area"><div class="svg-cap">ภาพประกอบเพื่อเทียบ</div><div id="qSvg">${genSVG(pg.svg)}</div></div>`;
    if (pg.strip) h += '<div id="monSlot"></div>';
    h += `<div class="quiz-box"><div class="q-label">📝 คำถามทบทวน (ยังไม่นับคะแนน)</div><div class="q-text">${pg.question}</div>
      ${order.map(ci => `<button class="q-btn" onclick="answerQuiz(this,${ci})">${pg.choices[ci].t}</button>`).join('')}</div><div id="qfb"></div>
      <div class="nav-row"><button class="ghost-btn" onclick="prevPage()">← ย้อน</button><button class="ghost-btn" style="flex:1" onclick="nextPage()">ข้ามไปหน้าถัดไป</button></div>`;
  } else {
    h += testShell(pg);
  }
  el('v-lesson').innerHTML = h;
  const slot = el('monSlot');
  if (slot) slot.replaceWith(monitor);
  show('lesson'); window.scrollTo(0, 0);
  if (pg.type === 'content' && pg.strip) { useStrip(pg.stripOpts ? makeStrip(pg.stripOpts) : lessonS, 'ตัวอย่าง 6 วินาที'); setOverlay(pg.strip); }
  if (pg.type === 'quiz' && pg.strip) { useStrip(makeStrip(pg.strip.opts), 'กราฟจริงเพื่อเทียบ'); setOverlay(pg.strip.q); }
  if (pg.type === 'drill' || pg.type === 'practice') startItem();
}
function prevPage() { if (ST.page > 0) { ST.page--; renderPage(); } }
function nextPage() {
  const les = curLes();
  if (ST.page < les.pages.length - 1) { ST.page++; return renderPage(); }
  parkMonitor();
